# Model config for case 12: DiningPhilosophers (negative — deadlock)
# pc uses Seq<char> for state names.
# Reduced to NumPhil=2 for tractable state space.

[constants.assignments]
NumPhil = 2

[search]
max_depth = 50
max_states = 500000
timeout_ms = 60000
candidate_eval_guardrail = 200000

[properties]
invariants = []
check_deadlock = true
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 2 }
max_set_len = 2
max_seq_len = 2
max_map_len = 2

[quantifiers.types.Seq_char]
kind = "values"
values = ["thinking", "has_left", "eating"]
