# Model config — narrow bounds for tractable existential expansion

[constants.assignments]
EPaxosMessage = 0
State = 0
Constants = 0
fast_quorum_size = 2
my_id = 0
num_replicas = 3
quorum_size = 1

[search]
# Keep this bounded model non-vacuous but tractable for suite runs.
max_depth = 1
max_states = 9000
timeout_ms = 120000
candidate_eval_guardrail = 1000000

[properties]
invariants = []
check_deadlock = true
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 1 }

[collections]
max_set_len = 1
max_seq_len = 1
max_map_len = 1
