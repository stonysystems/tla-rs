# Model config for case 19: EPaxos (small bounds)
# LState = LRecord with 5 int fields (no Maps/Sets/Strings).

[search]
max_depth = 20
max_states = 100000
timeout_ms = 30000

[properties]
invariants = []
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 1 }
max_set_len = 1
max_seq_len = 1
max_map_len = 1
