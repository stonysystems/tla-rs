# Model config — case 19 hand-written EPaxos (Phase 38.20.2).
# Single-replica EPaxos instance, my_id = 0, NumReplicas = 2.
#
# Phase 38.18.6 re-enabled deadlock checking: the ∧-through-∨
# distribution fix cleared the pre-38.18.6 timeout (was stuck in
# candidate-enumeration fallback). Now finishes in ~0.6 s.

[search]
max_depth = 6
max_states = 1000000
timeout_ms = 600000
candidate_eval_guardrail = 1000000

[properties]
invariants = []
check_deadlock = true
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 1 }

[collections]
max_set_len = 2
max_seq_len = 1
max_map_len = 1
