# Model config for case 08: BoundedBuffer bug reproduction profile.
# Keep collections minimal, but widen constants/int enough to trigger overflow.

[constants.assignments]
MaxVal = 3

[search]
max_depth = 20
max_states = 300000
timeout_ms = 15000

[properties]
invariants = []
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 3 }

[collections]
max_set_len = 2
max_seq_len = 2
max_map_len = 2
