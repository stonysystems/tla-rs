# Model config for case 20: Raft
# 5 servers for meaningful quorum-based election state space.

[constants.assignments]
server = 5

[search]
max_depth = 30
max_states = 500000
timeout_ms = 1800000
candidate_eval_guardrail = 500000

[properties]
invariants = ["ElectionSafety"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 5 }

[collections]
max_set_len = 5
max_seq_len = 2
max_map_len = 2

[quantifiers.types.Seq_char]
kind = "values"
values = ["follower", "candidate", "leader"]
