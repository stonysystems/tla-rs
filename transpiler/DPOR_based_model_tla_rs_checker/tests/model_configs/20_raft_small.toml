# Model config for case 20: Raft (small bounds)
# state uses Seq<char> for role names.

[constants.assignments]
Server = 2

[search]
max_depth = 30
max_states = 200000
timeout_ms = 60000
candidate_eval_guardrail = 200000

[properties]
invariants = []
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 2 }

[collections]
max_set_len = 2
max_seq_len = 2
max_map_len = 2

[quantifiers.types.Seq_char]
kind = "values"
values = ["follower", "candidate", "leader"]
