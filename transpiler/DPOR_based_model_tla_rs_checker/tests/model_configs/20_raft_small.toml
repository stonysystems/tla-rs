# Model config for case 20: Raft.
# Phase 38.20.3 / 38.16.3.b: scaled to server=8, depth=50.
# Sweep: 5 → 681 / 0.43 s; 8/depth30 → 812 / 2.6 s;
# 8/depth50 → 1089 / 2.3 s (fully converged at depth 41).
# 10+ → evaluator-hook missing for LFollower at int max ≥ 8.

[constants.assignments]
server = 8

[search]
max_depth = 50
max_states = 500000
timeout_ms = 600000
candidate_eval_guardrail = 500000

[properties]
invariants = ["LElectionSafety"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 8 }

[collections]
max_set_len = 8
max_seq_len = 2
max_map_len = 2

[quantifiers.types.Seq_char]
kind = "values"
values = ["follower", "candidate", "leader"]
