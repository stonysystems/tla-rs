# Model config — case 15 hand-written Chain Replication (Phase 38.20.2).
# Single-node middle-node perspective in a chain of length 3.
# Values = {1,2}; history is a Set<Values>.

[search]
max_depth = 6
max_states = 5000000
timeout_ms = 600000
candidate_eval_guardrail = 5000000

[properties]
invariants = []
check_deadlock = true
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 2 }

[collections]
max_set_len = 3
max_seq_len = 1
max_map_len = 1
