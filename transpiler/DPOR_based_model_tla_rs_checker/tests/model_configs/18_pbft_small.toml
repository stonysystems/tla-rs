# Model config for case 18: PBFT.
# Phase 38.18.8 / 38.16.3.b scale-up: 7 → 45 replicas.
#   7   → 49 states, 0.07 s   (baseline)
#   40  → 2854 states, 5.0 s
#   45  → 3659 states, 6.5 s   (chosen)
#   46+ → evaluator-hook missing for LPrePrepare (int max ≥ 46)
# Settled on 45 — ceiling before evaluator-hook bug.

[constants.assignments]
replica = 45
f = 2

[search]
max_depth = 100
max_states = 500000
timeout_ms = 600000
candidate_eval_guardrail = 500000

[properties]
invariants = ["LPBFTSafety"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 45 }

[collections]
max_set_len = 1
max_seq_len = 1
max_map_len = 1

[quantifiers.types.Seq_char]
kind = "values"
values = ["pre-prepare", "prepare", "commit", "reply"]
