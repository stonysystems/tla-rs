# Model config for case 18: PBFT.
# Phase 38.18.8 scale-up: 7 → 40 replicas.
#   7   → 49 states, 0.07 s   (baseline)
#   20  → 634 states, 0.86 s
#   40  → 2854 states, 6.8 s   (chosen)
#   50+ → evaluator-hook missing for LPrePrepare (int max ≥ 50)
# Settled on 40 — 58× state-count increase, ~100× wall-time but still
# well under the 10-min budget. Higher replica counts hit the
# LPrePrepare evaluator-hook missing bug.

[constants.assignments]
replica = 40
f = 2

[search]
max_depth = 100
max_states = 500000
timeout_ms = 600000
candidate_eval_guardrail = 500000

[properties]
invariants = ["LPBFTSafety"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 40 }

[collections]
max_set_len = 1
max_seq_len = 1
max_map_len = 1

[quantifiers.types.Seq_char]
kind = "values"
values = ["pre-prepare", "prepare", "commit", "reply"]
