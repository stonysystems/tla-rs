# Model config for case 18: PBFT (small bounds)
# phase uses Seq<char> for phase names.

[constants.assignments]
Replica = 1

[search]
max_depth = 30
max_states = 200000
timeout_ms = 60000
candidate_eval_guardrail = 200000

[properties]
invariants = []
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 1 }

[collections]
max_set_len = 1
max_seq_len = 1
max_map_len = 1

[quantifiers.types.Seq_char]
kind = "values"
values = ["pre-prepare", "prepare", "commit", "reply"]
