# Model config for case 18: PBFT
# 7 replicas (f=2, quorum=5) for meaningful state space.

[constants.assignments]
replica = 7
f = 2

[search]
max_depth = 100
max_states = 500000
timeout_ms = 1800000
candidate_eval_guardrail = 500000

[properties]
invariants = ["LPBFTSafety"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 7 }

[collections]
max_set_len = 1
max_seq_len = 1
max_map_len = 1

[quantifiers.types.Seq_char]
kind = "values"
values = ["pre-prepare", "prepare", "commit", "reply"]
