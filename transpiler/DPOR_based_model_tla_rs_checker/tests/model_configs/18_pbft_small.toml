# Model config for case 18: PBFT (small bounds)
# Keep Replica >= 4 meaningful with explicit constant assignments.

[constants.assignments]
replica = 4
f = 1

[search]
max_depth = 30
max_states = 200000
timeout_ms = 60000
candidate_eval_guardrail = 200000

[properties]
invariants = ["LPBFTSafety"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 4 }

[collections]
max_set_len = 1
max_seq_len = 1
max_map_len = 1

[quantifiers.types.Seq_char]
kind = "values"
values = ["pre-prepare", "prepare", "commit", "reply"]
