# Model config for case 10: BakeryMutex (negative — invariant_violation via BakeryMutexBug)
# pc uses Seq<char> for state names, choosing is Map<int, bool>.

[constants.assignments]
NumProcs = 3

[search]
max_depth = 50
max_states = 100000
timeout_ms = 30000

[properties]
invariants = ["LMutualExclusion"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 4 }
max_set_len = 3
max_seq_len = 3
max_map_len = 3

[quantifiers.types.Seq_char]
kind = "values"
values = ["idle", "choosing", "waiting", "critical"]
