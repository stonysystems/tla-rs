# Model config — case 16 hand-written Primary-Backup (Phase 38.20.2).
# Single-node Primary view; transitions Primary -> Inactive on fail
# and Inactive -> Primary on promote. Values = {1,2}, MaxLogLen = 2.

[search]
max_depth = 6
max_states = 100000
timeout_ms = 60000
candidate_eval_guardrail = 100000

[properties]
invariants = []
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 1 }

[collections]
max_set_len = 1
max_seq_len = 1
max_map_len = 1
