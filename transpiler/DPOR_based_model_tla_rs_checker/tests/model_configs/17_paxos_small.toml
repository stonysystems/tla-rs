# Model config for case 17: Paxos.
# Phase 38.20.3: kept at 3 acceptors / 3 values. Scale-up attempts
# (3/4, 4/3, 4/4) all exceed 600 s on the current single-threaded
# baseline explorer. See Paxos.tla comment block for the sweep.
# Future scale-up depends on Phase 38.18.1 (parallelize) or further
# Phase-38.18.5-style memoization wins.

[search]
max_depth = 30
max_states = 500000
timeout_ms = 600000
candidate_eval_guardrail = 500000

[properties]
invariants = ["LChosenValueAgreement"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 3 }

[collections]
max_set_len = 3
max_seq_len = 3
max_map_len = 3

[quantifiers.types.Seq_char]
kind = "values"
values = ["phase1a", "phase1b", "phase2a", "phase2b"]
