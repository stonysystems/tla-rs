# Model config for case 17: Paxos.
# Phase 38.18.8 scale-up: 3/3 → 4/4 acceptors/values. Pre-38.18.x
# 4/4 exceeded 600 s; post-inliner-fixes it fits comfortably.

[search]
max_depth = 40
max_states = 1000000
timeout_ms = 600000
candidate_eval_guardrail = 1000000
# Phase 38.18.9: acceptors are interchangeable; canonicalize maxBal/maxVBal
# (acceptor sets) under permutation. maxVal stays unsymmetric since values
# carry semantic identity.
symmetry_fields = ["maxBal", "maxVBal"]

[properties]
invariants = ["LChosenValueAgreement"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 8 }

[collections]
max_set_len = 8
max_seq_len = 8
max_map_len = 8

[quantifiers.types.Seq_char]
kind = "values"
values = ["phase1a", "phase1b", "phase2a", "phase2b"]
