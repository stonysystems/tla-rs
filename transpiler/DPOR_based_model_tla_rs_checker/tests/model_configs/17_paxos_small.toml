# Model config for case 17: Paxos (small bounds)
# Fixed 2-acceptor/2-value model in Paxos.tla (no LConstants).

[search]
max_depth = 30
max_states = 100000
timeout_ms = 30000

[properties]
invariants = ["LChosenValueAgreement"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 2 }

[collections]
max_set_len = 2
max_seq_len = 2
max_map_len = 2

[quantifiers.types.Seq_char]
kind = "values"
values = ["phase1a", "phase1b", "phase2a", "phase2b"]
