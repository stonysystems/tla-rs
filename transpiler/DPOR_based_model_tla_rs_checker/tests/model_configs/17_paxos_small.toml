# Model config for case 17: Paxos
# 3 acceptors / 3 values, no LConstants (hard-coded in spec).

[search]
max_depth = 30
max_states = 500000
timeout_ms = 1800000
candidate_eval_guardrail = 500000

[properties]
invariants = ["LChosenValueAgreement"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 3 }

[collections]
max_set_len = 3
max_seq_len = 3
max_map_len = 3

[quantifiers.types.Seq_char]
kind = "values"
values = ["phase1a", "phase1b", "phase2a", "phase2b"]
