# Model config for case 11: ReadersWriters (negative — invariant_violation via ReadersWritersBug)
# pc maps use Seq<char> for state names.

[constants.assignments]
NumReaders = 1
NumWriters = 1

[search]
max_depth = 50
max_states = 200000
timeout_ms = 60000
candidate_eval_guardrail = 50000

[properties]
invariants = ["LSafety"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 1 }
max_set_len = 2
max_seq_len = 2
max_map_len = 2

[quantifiers.types.Seq_char]
kind = "values"
values = ["idle", "reading", "writing"]
