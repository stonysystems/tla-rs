# Model config for case 13: TwoPhase commit
# tmState uses Seq<char> for state names; provide string constants.

[constants.assignments]
# RM = {r1, r2} — use small finite set of ints
# The spec uses LConstants with RM: Set<Seq<char>>

[search]
max_depth = 50
max_states = 100000
timeout_ms = 30000

[properties]
invariants = []
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 1 }

[collections]
max_set_len = 2
max_seq_len = 2
max_map_len = 2

[quantifiers.types.Seq_char]
kind = "values"
values = ["init", "committed", "aborted", "working", "prepared", "done"]
