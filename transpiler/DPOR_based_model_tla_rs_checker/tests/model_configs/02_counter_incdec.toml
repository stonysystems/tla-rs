# Model config for case 02: CounterIncDec
# pc uses Seq<char> for state names.
# Scale-up: NumProcs=6, int 0..10 → target >= 5000 distinct states.

[constants.assignments]
NumProcs = 4

[search]
max_depth = 100
max_states = 500000
timeout_ms = 300000

[properties]
invariants = ["LTypeOK"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 10 }

[collections]
max_set_len = 4
max_seq_len = 4
max_map_len = 4

[quantifiers.types.Seq_char]
kind = "values"
values = ["ready", "done"]
