# Model config — case 14 hand-written Election spec (Phase 38.20.2).
# Nodes = {1,2,3}, single-node bully-election perspective.
# Bounds tuned to match the spec's universe and stay tractable.

[search]
max_depth = 6
max_states = 5000000
timeout_ms = 600000
candidate_eval_guardrail = 5000000
# Phase 38.18.9: nodes are interchangeable; canonicalize the two
# Set<int> fields under permutation. Scalar int fields (leader,
# highest_heard, waiting_node) intentionally NOT included because
# they use 0 as a "no value" sentinel that shouldn't be relabeled.
symmetry_fields = ["electing", "alive"]

[properties]
invariants = []
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 4 }

[collections]
max_set_len = 4
max_seq_len = 1
max_map_len = 1
