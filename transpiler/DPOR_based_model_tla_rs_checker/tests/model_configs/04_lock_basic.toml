# Model config for case 04: LockBasic
# pc uses Seq<char> for state names.
# Scale-up: NumProcs=4, int 0..4.

[constants.assignments]
NumProcs = 4

[search]
max_depth = 100
max_states = 500000
timeout_ms = 300000

[properties]
invariants = ["LMutualExclusion"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 4 }

[collections]
max_set_len = 4
max_seq_len = 4
max_map_len = 4

[quantifiers.types.Seq_char]
kind = "values"
values = ["idle", "critical"]
