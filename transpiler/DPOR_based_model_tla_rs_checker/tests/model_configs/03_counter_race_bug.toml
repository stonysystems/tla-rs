# Model config for case 03: CounterRaceBug (negative — invariant_violation)
# pc uses Seq<char> for state names.

[constants.assignments]
NumProcs = 2

[search]
max_depth = 50
max_states = 200000
timeout_ms = 60000
candidate_eval_guardrail = 50000

[properties]
invariants = ["LTotalCorrect"]
check_deadlock = false
successor_semantics = "deadlock"

[quantifiers]
int = { min = 0, max = 2 }
max_set_len = 2
max_seq_len = 2
max_map_len = 2

[quantifiers.types.Seq_char]
kind = "values"
values = ["read", "write", "done"]
