stub_status = "bug_b_roundtrip_degraded"
notes = "VACUOUS PASS (0 distinct states explored). Source Election.tla is a real auto-generated bully election spec with proper actions and 3 safety invariants, but the Verus→TLA+→spec roundtrip collapses field harvesting: LState becomes a flat LRecord of message fields {leader,responder,sender}, the real state fields (electing, has_leader, alive, ...) are missing, every operator body becomes a soup of `arbitrary::<T>()` calls, LInit's `s` parameter is typed as `int` instead of LState, and the safety invariants degenerate to `Set::empty().contains(x) ==> Set::empty().contains(x)`. The model checker cannot construct a single initial state."

