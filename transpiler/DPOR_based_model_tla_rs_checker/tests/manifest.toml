source = "transpiler/tests/tla_examples/PBFT.tla"
stub_status = "bug_a_incomplete_next"
notes = "VACUOUS PASS. Source PBFT.tla declares Next == EnterCommit \\/ ExecuteAndReply \\/ ViewChange and drops the existentially-parameterized SendPrePrepare(v,n,d), SendPrepare(r,v,n,d), and SendCommit(r,v,n,d) actions. With Replica=1 (no real BFT replication possible) and the message-sending actions unreachable, prepareCount/commitCount stay at 0, so the Prepared/Committed predicates and EnterCommit/ExecuteAndReply transitions are dead. CommitSafety and TypeOK are real (non-tautological) predicates but the manifest passes no --invariant, so they are never checked. The 31 reachable states are just the ViewChange self-loop reset cycle."

