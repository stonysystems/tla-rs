milestone_gate = "M5"
negative = false
source = "transpiler/tests/tla_examples/Raft.tla"
stub_status = "bug_a_stub_source"
notes = "VACUOUS PASS. Source Raft.tla is a single-node role automaton, not Raft: no log, no commitIndex, no AppendEntries, no message passing, no quorum reasoning. State has only currentTerm/role/votedFor/votesGranted on a single notional server. Next == BecomeCandidate \\/ BecomeLeader \\/ StepDown drops the parameterized GrantVote(voter) action, so votesGranted never grows. AtMostOneLeader == state = Leader => votesGranted = votesGranted is a literal X => X tautology. The CONSTANT Server is never referenced anywhere in the spec, so the model_config Server=2 has no effect. The 31 reachable states are the role-cycling automaton, not Raft consensus."
