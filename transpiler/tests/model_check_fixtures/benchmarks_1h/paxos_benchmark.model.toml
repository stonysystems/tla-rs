# Paxos long-run benchmark config.
#
# BLOCKED: With 1 acceptor, the state space exhausts at 1 state instantly.
# With 2+ acceptors and quorum_size >= 1, the candidate enumeration cannot
# find valid next-state transitions (evaluates 327K candidates in 27s
# with no hits). The source-first model checker needs constraint-aware
# successor computation before this protocol can produce a meaningful
# long-run benchmark.
#
# This config uses the target 3-node model for documentation purposes.
# It will hit the enumeration guardrail or time out without progress.
#
# Historical TLC reference: 3 nodes, quorum=2, 3 values → TIMEOUT
# (~109M states, ~18M distinct in 5 minutes).

[constants.assignments]
quorum_size = 2
node_id = 0

[constants.domains.acceptors]
kind = "values"
values = ["set:{int:0,int:1,int:2}"]

[quantifiers.int]
min = 0
max = 2

[collections]
max_set_len = 3
max_seq_len = 3

[search]
max_depth = 100
max_states = 10000000
timeout_ms = 3600000
candidate_eval_guardrail = 100000000

[properties]
invariants = [
  "LSafetyAcceptedBallotBoundedByPromise",
  "LSafetyDecidedRequiresQuorum",
  "LSafetyDecidedMatchesProposedValue",
]
check_deadlock = false
successor_semantics = "deadlock"
