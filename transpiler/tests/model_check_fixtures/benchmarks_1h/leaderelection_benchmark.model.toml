# LeaderElection long-run benchmark config.
#
# Current status (after Phase 33.4.4.e helper-solver improvements):
# - The 3-node matched benchmark now makes non-zero exact-mode progress
#   (hundreds of states and transitions before timeout).
# - Remaining timeout pressure is branch-family existential blow-up
#   (not next-state candidate enumeration fallback).
#
# This config uses the target 3-node model for documentation purposes.
# It still times out under the 4-minute benchmark budget, but now with
# measurable progress and branch-level blocker telemetry.
#
# Historical TLC reference: 3 nodes → 100,636 states, 9,337 distinct,
# 18 depth, 2s.

[constants.assignments]
num_nodes = 0

[constants.domains.nodes]
kind = "values"
values = ["set:{int:0,int:1,int:2}"]

[quantifiers.int]
min = 0
max = 2

[quantifiers.types.LElectionMessage]
kind = "enum_subset"
variants = ["Election", "Answer", "Coordinator"]

[collections]
max_seq_len = 3
max_set_len = 3

[search]
max_depth = 100
max_states = 10000000
timeout_ms = 3600000
candidate_eval_guardrail = 100000000

[properties]
invariants = [
  "LSafetyElectingSubsetAlive",
  "LSafetyWaitingNodeAliveWhenWaiting",
  "LSafetyNoWaitingImpliesClearedWaitingNode",
]
check_deadlock = false
successor_semantics = "deadlock"
