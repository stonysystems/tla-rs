# Variant of quantifier_forall_exists.model.toml that explicitly uses
# lossy hash-compaction dedup for bug-finding acceleration reporting checks.
[constants.assignments]
lower = 0
upper = 1

[quantifiers.int]
min = 0
max = 1

[quantifiers.nat]
max = 1

[search]
max_depth = 2
max_states = 200
timeout_ms = 10000
state_dedup = "hash_compaction64"

[properties]
check_deadlock = false
successor_semantics = "deadlock"
