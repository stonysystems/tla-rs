# Intentionally omits `quantifiers.types.LLogEntry` to capture the current
# source-first Raft blocker as a checked-in regression fixture.
[constants.assignments]
quorum_size = 1
my_id = 0

[constants.domains.servers]
kind = "values"
values = ["set:{int:0}"]

[quantifiers.int]
min = 0
max = 0

[quantifiers.nat]
max = 0

[search]
max_depth = 1
max_states = 200
timeout_ms = 10000

[properties]
check_deadlock = false
successor_semantics = "deadlock"
