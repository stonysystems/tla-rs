# Minimal TwoPhase config for parity testing.
# 1 RM, minimal domain. Should find all reachable states including
# prepare/commit paths.
#
# Root cause of prior 0-successor bug: PreparedVote was missing from
# the enum_subset. Now fixed.

[constants.domains.rm]
kind = "values"
values = ["set:{int:0}"]

[quantifiers.int]
min = 0
max = 0

[quantifiers.types.LTPCMessage]
kind = "enum_subset"
variants = ["Prepare", "PreparedVote", "Commit", "Abort"]

[collections]
max_set_len = 1
max_seq_len = 1

[search]
max_depth = 20
max_states = 1000
timeout_ms = 30000
candidate_eval_guardrail = 100000

[properties]
invariants = []
check_deadlock = false
successor_semantics = "deadlock"
