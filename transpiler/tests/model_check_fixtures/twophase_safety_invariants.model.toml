[constants.domains.rm]
kind = "values"
values = ["set:{int:0}"]

[quantifiers.int]
min = 0
max = 0

[quantifiers.types.LTPCMessage]
kind = "enum_subset"
variants = ["Prepare", "Commit", "Abort"]

[collections]
max_set_len = 1

[search]
max_depth = 1
max_states = 200
timeout_ms = 10000

[properties]
# LSafetyNoCommitAbortOverlap and LSafetyCommittedSubsetPrepared use
# `forall` quantifiers which the model-check evaluator does not support.
# Only LSafetyTmCommittedRequiresAllPrepared uses a simple `is` + `==`
# pattern that the evaluator can handle.
invariants = [
  "LSafetyTmCommittedRequiresAllPrepared",
]
check_deadlock = false
successor_semantics = "deadlock"
