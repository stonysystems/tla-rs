[package]
name = "tla-rs"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the IronFleet verified distributed systems framework"
license = "MIT"
repository = "https://github.com/verus-lang/tla-rs"
keywords = ["distributed-systems", "verification", "verus", "paxos", "consensus"]
categories = ["algorithms", "science"]

#[dependencies]
#vstd = { git = "https://github.com/verus-lang/verus.git" }

[features]
optimized_rsl = []

[package.metadata.verus.ide]
extra_args = "--crate-type=dylib --expand-errors --multiple-errors 5"

