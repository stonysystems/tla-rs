# Configuration for transpiling Bully Leader Election spec to exec implementation

# Skip functions that contain existential quantifiers
skip_functions = [
    "LNext",
]

# Arc-wrap non-scalar fields of CState for O(1) clone
# Emit &mut self calling convention for CState methods (Phase 48)
mut_self_types = ["CState"]

arc_wrap_types = ["CState"]

[arc_wrap_fields]
CState = ["electing", "alive"]

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use std::collections::HashSet;",
    "use crate::protocol::LeaderElection::types::*;",
    "use crate::protocol::LeaderElection::election::*;",
    "use crate::generated::LeaderElection::types_gen::*;",
]

[messages]
enum_name = "LeaderElectionMessage"
doc_comment = "Bully Leader Election protocol network messages."

[[messages.variants]]
name = "Election"
doc = "Node announces candidacy to higher-ID nodes."
fields = [["sender", "u64"]]

[[messages.variants]]
name = "Answer"
doc = "Higher-ID node responds, suppressing the election."
fields = [["responder", "u64"]]

[[messages.variants]]
name = "Coordinator"
doc = "Elected leader announces itself."
fields = [["leader", "u64"]]
# Auto-generated from LNext — 7 actions
[scheduler]
next_fn = "LNext"
params = ["s", "s_", "c"]
action_count = 7
# SendAnswer is a response to an Election message
message_response_overrides = ["SendAnswer"]

[[scheduler.actions]]
spec_name = "LDetectFailure"
exec_name = "CDetectFailure"
kind = "timer_driven"
existential_params = [["node", "int"], ["sent_packets", "Seq<LElectionMessage>"]]

[[scheduler.actions]]
spec_name = "LStartElection"
exec_name = "CStartElection"
kind = "timer_driven"
existential_params = [["node", "int"], ["sent_packets", "Seq<LElectionMessage>"]]

[[scheduler.actions]]
spec_name = "LSendAnswer"
exec_name = "CSendAnswer"
kind = "message_driven"
message_variant = "Election"
existential_params = [["node", "int"], ["sender", "int"], ["sent_packets", "Seq<LElectionMessage>"]]

[[scheduler.actions]]
spec_name = "LReceiveAnswer"
exec_name = "CReceiveAnswer"
kind = "message_driven"
message_variant = "Answer"
existential_params = [["node", "int"], ["responder", "int"], ["sent_packets", "Seq<LElectionMessage>"]]

[[scheduler.actions]]
spec_name = "LSendCoordinator"
exec_name = "CSendCoordinator"
kind = "timer_driven"
existential_params = [["node", "int"], ["sent_packets", "Seq<LElectionMessage>"]]

[[scheduler.actions]]
spec_name = "LReceiveCoordinator"
exec_name = "CReceiveCoordinator"
kind = "message_driven"
message_variant = "Coordinator"
existential_params = [["node", "int"], ["leader", "int"], ["sent_packets", "Seq<LElectionMessage>"]]

[[scheduler.actions]]
spec_name = "LNodeFail"
exec_name = "CNodeFail"
kind = "timer_driven"
existential_params = [["node", "int"], ["sent_packets", "Seq<LElectionMessage>"]]
