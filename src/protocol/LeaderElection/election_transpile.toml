# Configuration for transpiling Bully Leader Election spec to exec implementation

# Skip functions that contain existential quantifiers
skip_functions = [
    "LNext",
]

# Primitive types that don't need valid() predicates
primitive_types = []

# Fields that are collection types (Set/Map) requiring clone_hashset()
# Non-listed fields are Copy types (u64, bool) and use direct access
collection_fields = ["electing", "alive", "nodes"]

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[remapping]
"LState" = "CState"
"LConstants" = "CConstants"
"LNodeState" = "CNodeState"

[clone_strategy]
"CState" = "external_body"
"CConstants" = "external_body"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use std::collections::HashSet;",
    "use crate::protocol::LeaderElection::types::*;",
    "use crate::protocol::LeaderElection::election::*;",
    "use crate::generated::LeaderElection::types_gen::*;",
]

[messages]
enum_name = "LeaderElectionMessage"
doc_comment = "Bully Leader Election protocol network messages."

[[messages.variants]]
name = "Election"
doc = "Node announces candidacy to higher-ID nodes."
fields = [["sender", "u64"]]

[[messages.variants]]
name = "Answer"
doc = "Higher-ID node responds, suppressing the election."
fields = [["responder", "u64"]]

[[messages.variants]]
name = "Coordinator"
doc = "Elected leader announces itself."
fields = [["leader", "u64"]]
# Auto-generated from LNext — 7 actions
[scheduler]
next_fn = "LNext"
params = ["s", "s_", "c"]
action_count = 7

[[scheduler.actions]]
spec_name = "LDetectFailure"
exec_name = "CDetectFailure"
kind = "timer_driven"
existential_params = [["node", "int"]]

[[scheduler.actions]]
spec_name = "LStartElection"
exec_name = "CStartElection"
kind = "timer_driven"
existential_params = [["node", "int"]]

[[scheduler.actions]]
spec_name = "LSendAnswer"
exec_name = "CSendAnswer"
kind = "message_driven"
message_variant = "Election"
existential_params = [["node", "int"]]

[[scheduler.actions]]
spec_name = "LReceiveAnswer"
exec_name = "CReceiveAnswer"
kind = "message_driven"
message_variant = "Answer"
existential_params = [["node", "int"]]
flag_injections = [["msgs_answer", "true"], ["msgs_answer_responder", "responder"]]

[[scheduler.actions]]
spec_name = "LSendCoordinator"
exec_name = "CSendCoordinator"
kind = "timer_driven"
existential_params = [["node", "int"]]

[[scheduler.actions]]
spec_name = "LReceiveCoordinator"
exec_name = "CReceiveCoordinator"
kind = "message_driven"
message_variant = "Coordinator"
existential_params = [["node", "int"]]
flag_injections = [["msgs_coordinator", "true"], ["msgs_coordinator_leader", "leader"]]

[[scheduler.actions]]
spec_name = "LNodeFail"
exec_name = "CNodeFail"
kind = "timer_driven"
existential_params = [["node", "int"]]

