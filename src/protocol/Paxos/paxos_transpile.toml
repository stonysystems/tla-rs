# Configuration for transpiling Single-Decree Paxos spec to exec implementation

# Skip functions that contain existential quantifiers
skip_functions = [
    "LNext",
]

# Primitive types that don't need valid() predicates
primitive_types = []

# Fields that are collection types (Set/Map) requiring clone_hashset()
collection_fields = ["promises_rcvd", "accepts_rcvd", "acceptors"]

# Enum fields that need clone helpers (not Copy types)
clone_fields = ["phase"]

[clone_field_types]
"phase" = "CPhase"

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[remapping]
"LState" = "CState"
"LConstants" = "CConstants"
"LPhase" = "CPhase"

[clone_strategy]
"CState" = "external_body"
"CConstants" = "external_body"

[variant_remapping]
"Idle" = "CPhase::Idle"
"Phase1" = "CPhase::Phase1"
"Phase2" = "CPhase::Phase2"
"Decided" = "CPhase::Decided"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use std::collections::HashSet;",
    "use crate::protocol::Paxos::types::*;",
    "use crate::protocol::Paxos::paxos::*;",
    "use crate::generated::Paxos::types_gen::*;",
]

[messages]
enum_name = "PaxosMessage"
doc_comment = "Single-Decree Paxos protocol network messages."

[[messages.variants]]
name = "Prepare"
doc = "Phase 1a: Proposer sends Prepare with a ballot number."
fields = [["ballot", "u64"]]

[[messages.variants]]
name = "Promise"
doc = "Phase 1b: Acceptor promises not to accept lower ballots."
fields = [["ballot", "u64"], ["accepted_bal", "u64"], ["accepted_val", "u64"]]

[[messages.variants]]
name = "Accept"
doc = "Phase 2a: Proposer sends Accept with ballot and chosen value."
fields = [["ballot", "u64"], ["value", "u64"]]

[[messages.variants]]
name = "Accepted"
doc = "Phase 2b: Acceptor confirms it has accepted the ballot/value."
fields = [["ballot", "u64"], ["value", "u64"]]
# Auto-generated from LNext — 7 actions
[scheduler]
next_fn = "LNext"
params = ["s", "s_", "c"]
action_count = 7

[[scheduler.actions]]
spec_name = "LSend1a"
exec_name = "CSend1a"
kind = "timer_driven"
existential_params = [["b", "int"]]

[[scheduler.actions]]
spec_name = "LSend1b"
exec_name = "CSend1b"
kind = "message_driven"
message_variant = "Prepare"
existential_params = [["b", "int"]]

[[scheduler.actions]]
spec_name = "LRecvPromise"
exec_name = "CRecvPromise"
kind = "message_driven"
message_variant = "Promise"
existential_params = [["a", "int"], ["ab", "int"], ["av", "int"]]

[[scheduler.actions]]
spec_name = "LSend2a"
exec_name = "CSend2a"
kind = "timer_driven"
existential_params = [["v", "int"]]

[[scheduler.actions]]
spec_name = "LSend2b"
exec_name = "CSend2b"
kind = "message_driven"
message_variant = "Accept"
existential_params = [["b", "int"], ["v", "int"]]

[[scheduler.actions]]
spec_name = "LRecvAccepted"
exec_name = "CRecvAccepted"
kind = "message_driven"
message_variant = "Accepted"
existential_params = [["a", "int"]]

[[scheduler.actions]]
spec_name = "LLearn"
exec_name = "CLearn"
kind = "timer_driven"

