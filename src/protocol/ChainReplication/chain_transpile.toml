# Configuration for transpiling Chain Replication spec to exec implementation

# Skip functions that contain existential quantifiers
skip_functions = [
    "LNext",
]

# Primitive types that don't need valid() predicates
primitive_types = []

# Fields that are HashSet types (Set) requiring clone_hashset()
collection_fields = ["pending_sent"]

# Fields that are Vec types (Seq) requiring .clone()
vec_fields = ["history"]

# Fields that are non-Copy types requiring .clone() but not @ in view
clone_fields = ["role"]

# Maps clone_fields to their exec enum types for generating clone helpers
[clone_field_types]
"role" = "CNodeRole"

# Extra requires clauses that the transpiler can't derive automatically
[extra_requires]
"CInit" = ["c.node_id < c.chain_len"]

[clone_strategy]
"CState" = "external_body"

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[remapping]
"LState" = "CState"
"LConstants" = "CConstants"
"LNodeRole" = "CNodeRole"

[variant_remapping]
"Head" = "CNodeRole::Head"
"Middle" = "CNodeRole::Middle"
"Tail" = "CNodeRole::Tail"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use std::collections::HashSet;",
    "use crate::protocol::ChainReplication::types::*;",
    "use crate::protocol::ChainReplication::chain::*;",
    "use crate::generated::ChainReplication::types_gen::*;",
]

[messages]
enum_name = "ChainMessage"
doc_comment = "Chain Replication protocol network messages."

[[messages.variants]]
name = "Forward"
doc = "Forward a write to the next node in the chain."
fields = [["value", "u64"]]

[[messages.variants]]
name = "Ack"
doc = "Acknowledge a committed write back up the chain."
fields = [["value", "u64"]]

[[messages.variants]]
name = "ClientWrite"
doc = "Client sends a write request to the head."
fields = [["value", "u64"]]

[[messages.variants]]
name = "ClientRead"
doc = "Client sends a read request to the tail."
# Auto-generated from LNext — 8 actions
[scheduler]
next_fn = "LNext"
params = ["s", "s_", "c"]
action_count = 8

[[scheduler.actions]]
spec_name = "LHeadReceiveWrite"
exec_name = "CHeadReceiveWrite"
kind = "message_driven"
message_variant = "ClientWrite"
existential_params = [["value", "int"]]

[[scheduler.actions]]
spec_name = "LForwardToSuccessor"
exec_name = "CForwardToSuccessor"
kind = "timer_driven"
existential_params = [["value", "int"]]

[[scheduler.actions]]
spec_name = "LReceiveUpdate"
exec_name = "CReceiveUpdate"
kind = "message_driven"
existential_params = [["value", "int"]]

[[scheduler.actions]]
spec_name = "LTailCommit"
exec_name = "CTailCommit"
kind = "timer_driven"
existential_params = [["value", "int"]]

[[scheduler.actions]]
spec_name = "LReceiveAck"
exec_name = "CReceiveAck"
kind = "message_driven"
message_variant = "Ack"
existential_params = [["value", "int"]]

[[scheduler.actions]]
spec_name = "LClientRead"
exec_name = "CClientRead"
kind = "message_driven"
message_variant = "ClientRead"

[[scheduler.actions]]
spec_name = "LNodeFail"
exec_name = "CNodeFail"
kind = "timer_driven"

[[scheduler.actions]]
spec_name = "LReconfigure"
exec_name = "CReconfigure"
kind = "timer_driven"
existential_params = [["new_has_predecessor", "bool"], ["new_predecessor", "int"], ["new_has_successor", "bool"], ["new_successor", "int"]]

