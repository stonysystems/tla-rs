# Configuration for transpiling RSL broadcast spec to implementation

# Functions to skip during transpilation (require manual implementation)
skip_functions = [
    # Complex recursive function that cannot be auto-transpiled
    "BuildLBroadcast",
]

[naming]
spec_prefix = "L"
exec_prefix = "C"
# RSL implementation uses u64 for all numeric types for marshalling compatibility
int_type = "u64"
nat_type = "u64"

[remapping]
"LConfiguration" = "CConfiguration"
"RslMessage" = "CMessage"
"RslPacket" = "CPacket"
"AbstractEndPoint" = "CAbstractEndPoint"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
# Broadcast module only uses shared infrastructure types (no module-specific state)
# Custom imports for broadcast module - all shared infrastructure types
# These are needed for CMessage, CPacket, CConfiguration operations.
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::seq::*;",
    "use crate::common::native::io_s::EndPoint;",
    "use crate::generated::RSL::types_gen::*;",
    "use crate::implementation::RSL::cconstants::*;",
    "use crate::implementation::RSL::cmessage::*;",
    "use crate::implementation::RSL::cconfiguration::*;",
    "use crate::protocol::RSL::broadcast::*;",
    "use crate::protocol::RSL::types::*;",
    "use crate::protocol::RSL::configuration::*;",
]
