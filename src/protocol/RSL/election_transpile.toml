# Configuration for transpiling RSL election spec to implementation
# This configures the transpiler to match the existing RSL codebase conventions

# Spec-only functions that should not get C-prefix (must be at top level before sections)
spec_only_functions = [
    "LtUpperBound",
    "LeqUpperBound",
]

# Type aliases that are really Vec<T> — skip valid() since Vec doesn't have it
skip_valid_types = ["RequestBatch"]

# All functions are in skip_functions — proofs too complex for auto-generation.
# Manual implementations in election_manual.rs use assume-based proof pattern.
skip_functions = [
    "BoundRequestSequence",
    "ComputeSuccessorView",
    "RequestsMatch",
    "RequestSatisfiedBy",
    "RemoveAllSatisfiedRequestsInSequence",
    "ElectionStateInit",
    "ElectionStateProcessHeartbeat",
    "ElectionStateCheckForViewTimeout",
    "ElectionStateCheckForQuorumOfViewSuspicions",
    "ElectionStateReflectReceivedRequest",
    "RemoveExecutedRequestBatch",
    "ElectionStateReflectExecutedRequestBatch",
]

# ElectionState collection fields used in set/seq expression lowering.
collection_fields = ["current_view_suspectors"]
vec_fields = ["requests_received_this_epoch", "requests_received_prev_epochs"]

# Custom view expressions for types in ensures clauses
# RequestBatch (= Seq<Request>) needs deep conversion from Vec<CRequest>
[type_view_exprs]
"RequestBatch" = "abstractify_crequestbatch({param})"

[naming]
spec_prefix = "L"
exec_prefix = "C"
# RSL implementation uses u64 for all numeric types for marshalling compatibility
int_type = "u64"
nat_type = "u64"

[remapping]
# RSL-specific type mappings
"ElectionState" = "CElectionState"
"LReplicaConstants" = "CReplicaConstants"
"Ballot" = "CBallot"
"RslPacket" = "CPacket"
"Request" = "CRequest"
"RequestBatch" = "CRequestBatch"
"RslMessage" = "CMessage"
"RslMessageHeartbeat" = "CMessage::CMessageHeartbeat"

# Method call mappings: spec functions that become method calls
[method_calls]
"LMinQuorumSize" = { method_name = "CMinQuorumSize", receiver_arg_index = 0 }
"GetReplicaIndex" = { method_name = "CGetReplicaIndex", receiver_arg_index = 1, destructure_index = 1 }

[function_paths]
"BoundRequestSequence" = "crate::generated::RSL::types_gen::CElectionState::CBoundRequestSequence"

# Ballot-typed fields that need CBalEq instead of derived PartialEq (external in Verus)
[eq_function_fields]
"bal_heartbeat" = "CBalEq"
"current_view" = "CBalEq"

[extra_fields]
"CElectionState.cur_req_set" = "HashSet<CRequestHeader> = HashSet::new()"
"CElectionState.prev_req_set" = "HashSet<CRequestHeader> = HashSet::new()"

[arrow_variants]
"bal_1a" = "CMessage::CMessage1a"
"bal_1b" = "CMessage::CMessage1b"
"bal_2a" = "CMessage::CMessage2a"
"bal_2b" = "CMessage::CMessage2b"
"bal_heartbeat" = "CMessage::CMessageHeartbeat"
"suspicious" = "CMessage::CMessageHeartbeat"
"opn_ckpt" = "CMessage::CMessageHeartbeat"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
# CElectionState comes from types_gen.rs (includes optimization fields)
generate_inline_types = false
# Path to manually-written complex functions (relative to this TOML file)
manual_code = "election_manual.rs"
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::map::*;",
    "use vstd::set::*;",
    "use vstd::set_lib::*;",
    "use std::collections::HashSet;",
    "use crate::common::collections::sets::*;",
    "use crate::common::collections::hashsets::*;",
    "use crate::common::collections::vecs::*;",
    "use crate::common::native::io_s::EndPoint;",
    "use crate::generated::RSL::types_gen::*;",
    "use crate::implementation::RSL::cmessage::*;",
    "use crate::implementation::RSL::types_i::abstractify_crequestbatch;",
    "use crate::implementation::common::upper_bound_i::*;",
    "use crate::implementation::common::upper_bound::*;",
    "use crate::protocol::RSL::election::*;",
    "use crate::protocol::RSL::types::*;",
    "use crate::protocol::RSL::configuration::*;",
    "use crate::protocol::common::upper_bound::LtUpperBound;",
]
