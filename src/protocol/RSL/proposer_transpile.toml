# Configuration for transpiling RSL proposer spec to implementation

# Primitive types that don't need valid() predicates
# OperationNumber is remapped to u64 which is a primitive
primitive_types = [
    "OperationNumber",
]

# Type aliases that are really Vec<T> — skip valid() since Vec doesn't have it
skip_valid_types = ["RequestBatch"]

# Vec fields — used for concat_vecs detection on s.election_state.* fields
vec_fields = ["requests_received_prev_epochs", "requests_received_this_epoch", "request_queue"]

# Types that should use .clone_up_to_view() instead of .clone() for verified clone loops
clone_up_to_view_types = ["CRequest"]

# HashMap fields for &key indexing (no helper generation)
hashmap_index_fields = ["highest_seqno_requested_by_client_this_view"]

# HashSet fields — needed to distinguish .contains() on HashSet from Vec
collection_fields = ["received_1b_packets"]

# Per-element ensures for Vec<CPacket> output parameters
vec_element_ensures = ["valid", "abstractable"]

# Functions to skip during transpilation (require manual implementation)
# The 3 Nominate functions have complex existential quantifiers, nested index access,
# and variable scoping issues that the transpiler cannot handle.
skip_functions = [
    "LProposerNominateOldValueAndSend2a",
    "LProposerNominateNewValueAndSend2a",
    "LProposerMaybeNominateValueAndSend2a",
]

# Spec predicates that exist in ProposerImpl.rs or are pure spec — suppress stubs
no_stub_functions = [
    "LIsAfterLogTruncationPoint",
    "LSetOfMessage1b",
    "LSetOfMessage1bAboutBallot",
    "LExistVotesHasProposalLargeThanOpn",
    "LExistsAcceptorHasProposalLargeThanOpn",
    "LAllAcceptorsHadNoProposal",
    "Lmax_balInS",
    "LExistsBallotInS",
    "LValIsHighestNumberedProposalAtBallot",
    "LValIsHighestNumberedProposal",
    "LProposerCanNominateUsingOperationNumber",
]

# Spec-only functions that should NOT get C-prefix
# These are spec predicates referenced in preconditions but have no exec implementation
spec_only_functions = [
    "WellFormedLConfiguration",
    "LIsAfterLogTruncationPoint",
    "LSetOfMessage1b",
    "LSetOfMessage1bAboutBallot",
    "LExistVotesHasProposalLargeThanOpn",
    "LExistsAcceptorHasProposalLargeThanOpn",
    "LAllAcceptorsHadNoProposal",
    "Lmax_balInS",
    "LExistsBallotInS",
    "LValIsHighestNumberedProposalAtBallot",
    "LValIsHighestNumberedProposal",
    "LProposerCanNominateUsingOperationNumber",
    # Skipped functions should not get C-prefix when referenced in requires/ensures
    "LProposerNominateOldValueAndSend2a",
    "LProposerNominateNewValueAndSend2a",
    "LProposerMaybeNominateValueAndSend2a",
]

# Method call mappings - spec functions that become method calls
[method_calls]
"LMinQuorumSize" = { method_name = "CMinQuorumSize", receiver_arg_index = 0 }
"LProposerCanNominateUsingOperationNumber" = { method_name = "CProposerCanNominateUsingOperationNumber", receiver_arg_index = 0 }

# Function path remapping for associated functions on CProposer
[function_paths]
"SetOfMessage1bAboutBallot" = "CProposer::CSetOfMessage1bAboutBallot"
"AllAcceptorsHadNoProposal" = "CProposer::CAllAcceptorsHadNoProposal"
"ExistsAcceptorHasProposalLargeThanOpn" = "CProposer::CExistsAcceptorHasProposalLargeThanOpn"

[naming]
spec_prefix = "L"
exec_prefix = "C"
# RSL implementation uses u64 for all numeric types for marshalling compatibility
int_type = "u64"
nat_type = "u64"

[remapping]
"LProposer" = "CProposer"
"LReplicaConstants" = "CReplicaConstants"
"RslPacket" = "CPacket"
"Ballot" = "CBallot"
"OperationNumber" = "u64"
"AbstractEndPoint" = "EndPoint"
"RslMessage" = "CMessage"
"RslMessage1a" = "CMessage::CMessage1a"
"RslMessage1b" = "CMessage::CMessage1b"
"RslMessage2a" = "CMessage::CMessage2a"
"RslMessage2b" = "CMessage::CMessage2b"
"RslMessageHeartbeat" = "CMessage::CMessageHeartbeat"
"RslMessageReply" = "CMessage::CMessageReply"
"RslMessageRequest" = "CMessage::CMessageRequest"
"RslMessageStartingPhase2" = "CMessage::CMessageStartingPhase2"

# Ballot-typed fields that need CBalEq instead of derived PartialEq (external in Verus)
[eq_function_fields]
"current_view" = "CBalEq"
"max_ballot_i_sent_1a" = "CBalEq"
"bal_1b" = "CBalEq"

[extra_fields]
"CProposer.max_log_truncation_point" = "u64 = 0u64"
"CProposer.max_opn_with_proposal" = "u64 = 0u64"

[type_view_exprs]
"RequestBatch" = "abstractify_crequestbatch({param})"

[variant_remapping]
"IncompleteBatchTimerOff" = "CIncompleteBatchTimer::CIncompleteBatchTimerOff"
"IncompleteBatchTimerOn" = "CIncompleteBatchTimer::CIncompleteBatchTimerOn"

[arrow_variants]
"seqno_req" = "CMessage::CMessageRequest"
"val" = "CMessage::CMessageRequest"
"bal_1b" = "CMessage::CMessage1b"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
# Proofs not yet mature — trust postconditions via assume(false)
assume_postconditions = true
# CProposer comes from types_gen.rs (includes optimization fields)
generate_inline_types = false
# manual_code removed — using --auto-skip --proof-fallback for untranslatable functions
# Custom imports for proposer module
# Note: Still need implementation imports for shared infrastructure types.
# CElectionState needed from ElectionImpl until election module is fully generated.
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::map::*;",
    "use vstd::set::*;",
    "use std::collections::HashMap;",
    "use std::collections::HashSet;",
    "use crate::common::collections::sets::*;",
    "use crate::common::collections::hashsets::*;",
    "use crate::common::collections::vecs::*;",
    "use crate::common::native::io_s::EndPoint;",
    "use crate::generated::RSL::types_gen::*;",
    "use crate::generated::RSL::broadcast_gen::CBroadcastToEveryone;",
    "use crate::generated::RSL::election_gen::*;",
    "use crate::implementation::RSL::cmessage::*;",
    "use crate::implementation::RSL::cbroadcast::*;",
    "use crate::implementation::RSL::gen_helpers::{clone_cpacket_preserving_validity, clone_cpacket_full, outbound_packets_to_vec};",
    # CIncompleteBatchTimer is defined in types_gen.rs - import the variant for convenience
    "use crate::generated::RSL::types_gen::CIncompleteBatchTimer::CIncompleteBatchTimerOff;",
    "use crate::implementation::common::upper_bound_i::*;",
    "use crate::implementation::common::upper_bound::CUpperBoundedAddition;",
    "use crate::protocol::RSL::proposer::*;",
    "use crate::protocol::RSL::types::*;",
    "use crate::protocol::RSL::configuration::*;",
    "use crate::implementation::RSL::types_i::abstractify_crequestbatch;",
    "use crate::implementation::RSL::types_i::clone_request_batch_up_to_view;",
]
