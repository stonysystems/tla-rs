# Configuration for transpiling RSL learner spec to implementation
# This configures the transpiler to match the existing RSL codebase conventions

# Primitive types that don't need valid() predicates
# OperationNumber is remapped to u64 which is a primitive
primitive_types = [
    "OperationNumber",
]

# Functions too complex for auto-generation (multi-branch map proofs, endpoint axioms)
skip_functions = [
    "LLearnerProcess2b",
    "LLearnerForgetDecision",
    "LLearnerForgetOperationsBefore",
]

# Field categories for clone dispatch
# constants: non-Copy CReplicaConstants, uses clone_up_to_view()
clone_fields = ["constants"]

# HashMap fields with deep abstraction (key AND value type conversion)
# Format: field_name = [exec_map_type, abstractify_prefix, exec_value_type]
[map_fields]
"unexecuted_learner_state" = ["CLearnerState", "clearnerstate", "CLearnerTuple"]

[naming]
spec_prefix = "L"
exec_prefix = "C"
# RSL implementation uses u64 for all numeric types for marshalling compatibility
int_type = "u64"
nat_type = "u64"

[remapping]
# RSL-specific type mappings
"LLearner" = "CLearner"
"LReplicaConstants" = "CReplicaConstants"
"Ballot" = "CBallot"
"RslPacket" = "CPacket"
"OperationNumber" = "u64"
"LearnerState" = "CLearnerState"
"LearnerTuple" = "CLearnerTuple"
"RslMessage" = "CMessage"
"RslMessage2b" = "CMessage::CMessage2b"

# Method call mappings
[method_calls]
"LMinQuorumSize" = { method_name = "CMinQuorumSize", receiver_arg_index = 0 }

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
# RSL uses 'valid()' instead of 'well_formed()'
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
# Generate explicit for loops instead of iterators for better Verus verification
generate_loops_for_verification = true
generate_proofs = true
# Don't generate CLearner inline — it's in types_gen.rs
generate_inline_types = false
# Use clone_up_to_view() for proof-compatible cloning
clone_method = "clone_up_to_view"
# Path to manually-written complex functions (relative to this TOML file)
manual_code = "learner_manual.rs"
# Custom imports for learner module
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::map::*;",
    "use vstd::set::*;",
    "use std::collections::HashMap;",
    "use std::collections::HashSet;",
    "use crate::common::collections::sets::*;",
    "use crate::common::collections::hashsets::*;",
    "use crate::common::collections::vecs::*;",
    "use crate::common::native::io_s::{AbstractEndPoint, EndPoint};",
    "use crate::generated::RSL::types_gen::*;",
    "use crate::protocol::RSL::learner::*;",
    "use crate::protocol::RSL::types::*;",
    "use vstd::std_specs::hash::KeysAdditionalSpecFns;",
]
