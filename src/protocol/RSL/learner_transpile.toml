# Configuration for transpiling RSL learner spec to implementation
# This configures the transpiler to match the existing RSL codebase conventions

# Primitive types that don't need valid() predicates
# OperationNumber is remapped to u64 which is a primitive
primitive_types = [
    "OperationNumber",
]

[naming]
spec_prefix = "L"
exec_prefix = "C"
# RSL implementation uses u64 for all numeric types for marshalling compatibility
int_type = "u64"
nat_type = "u64"

[remapping]
# RSL-specific type mappings
"LLearner" = "CLearner"
"LReplicaConstants" = "CReplicaConstants"
"Ballot" = "CBallot"
"RslPacket" = "CPacket"
"OperationNumber" = "u64"
"LearnerState" = "CLearnerState"
"LearnerTuple" = "CLearnerTuple"
"RslMessage" = "CMessage"
"RslMessage2b" = "CMessage::CMessage2b"

# Method call mappings
[method_calls]
"LMinQuorumSize" = { method_name = "CMinQuorumSize", receiver_arg_index = 0 }

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
# RSL uses 'valid()' instead of 'well_formed()'
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
# Generate explicit for loops instead of iterators for better Verus verification
generate_loops_for_verification = true
# Generate CLearner inline instead of importing from LearnerImpl.rs
generate_inline_types = true
# Custom imports for learner module
# Note: Still need implementation imports for shared infrastructure types
# (types_i, cconstants, cmessage, cbroadcast). These contain marshalling-enabled
# types that can't easily be generated. Future work: move to shared location.
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::map::*;",
    "use vstd::set::*;",
    "use std::collections::HashMap;",
    "use std::collections::HashSet;",
    "use crate::common::collections::sets::*;",
    "use crate::common::collections::hashsets::*;",
    "use crate::common::native::io_s::EndPoint;",
    "use crate::generated::RSL::types_gen::*;",
    "use crate::implementation::RSL::cconstants::*;",
    "use crate::implementation::RSL::cmessage::*;",
    "use crate::implementation::RSL::cbroadcast::*;",
    # CLearner now generated inline with generate_inline_types = true
    "use crate::protocol::RSL::learner::*;",
    "use crate::protocol::RSL::types::*;",
]
