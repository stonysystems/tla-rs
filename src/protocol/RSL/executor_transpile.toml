# Configuration for transpiling RSL executor spec to implementation

[naming]
spec_prefix = "L"
exec_prefix = "C"

[remapping]
"LExecutor" = "CExecutor"
"LReplicaConstants" = "CReplicaConstants"
"RslPacket" = "CRslPacket"
"OperationNumber" = "u64"
"OutstandingOperation" = "COutstandingOperation"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
# Generate CExecutor inline instead of importing from ExecutorImpl.rs
generate_inline_types = true
# Custom imports for executor module
# Note: Still need implementation imports for shared infrastructure types.
# CStateMachine is also needed for app state machine operations.
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::map::*;",
    "use vstd::set::*;",
    "use std::collections::HashMap;",
    "use std::collections::HashSet;",
    "use crate::common::collections::sets::*;",
    "use crate::common::collections::hashsets::*;",
    "use crate::common::native::io_s::EndPoint;",
    "use crate::implementation::RSL::types_i::*;",
    "use crate::implementation::RSL::cconstants::*;",
    "use crate::implementation::RSL::cmessage::*;",
    "use crate::implementation::RSL::cbroadcast::*;",
    # CExecutor now generated inline with generate_inline_types = true
    "use crate::implementation::RSL::CStateMachine::*;",
    "use crate::protocol::RSL::executor::*;",
    "use crate::protocol::RSL::types::*;",
]
