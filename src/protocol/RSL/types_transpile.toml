# Configuration for generating RSL types
# This is separate from the main transpile.toml for function generation
#
# Strategy: Generate exec types from spec definitions. Only RslMessage is skipped
# (defined via define_enum_and_derive_marshalable! macro in cmessage.rs).
# Types not in the spec (CMessage, CPacket, CAppState, CAppMessage, CBroadcast,
# OutboundPackets, CUpperBound, CRequestHeader, CStateMachine functions) are
# re-exported from their manual implementation modules.

# Types to skip during generation (macro-defined, cannot be auto-generated)
# RslMessage + selected concrete types supplied by macro-backed modules/manual helpers.
skip_types = [
    "RslMessage",
    # Macro-defined marshalable types in types_i.rs
    "Ballot",
    "Request",
    "Reply",
    "Vote",
    # Foundational blocks are supplied by implementation modules via re_exports.
    "LConfiguration",
    "LConstants",
    "LReplicaConstants",
    # Component block A is supplied by implementation modules via re_exports.
    "LAcceptor",
    "LLearner",
    "ElectionState",
    "OutstandingOperation",
    # Component block B is supplied by implementation modules via re_exports.
    "LExecutor",
    "IncompleteBatchTimer",
    "LProposer",
    "LReplica",
    "LScheduler",
    # Helper-owned type with custom clone_up_to_view/abstractable methods
    "LearnerTuple",
]

# Types with hand-written valid/view semantics kept outside generated output.
# Generate the struct/clone body, but keep these impl blocks manual for now.
skip_validity_types = ["CParameters"]
skip_view_types = ["CParameters"]

# Re-export statements for types that cannot be auto-generated.
# These are types defined via macros, with custom Hash/axiom/FFI logic,
# or concrete-only types with no spec equivalent.
re_exports = [
    # All shared types and helper functions from types_i.rs (CBallot, CRequest, CReply, CVote,
    # CLearnerTuple, and all spec helper fns: cvotes_is_valid, crequestbatch_is_valid, etc.)
    "crate::implementation::RSL::types_i::*",
    # Message types (CMessage via macro, CPacket with custom axioms)
    "crate::implementation::RSL::cmessage::*",
    # Application interface (CAppState, CAppMessage via macro, CAppStateInit)
    "crate::implementation::RSL::appinterface::{CAppState, CAppStateInit, CAppMessage}",
    # State machine (application-specific logic with complex proofs)
    "crate::implementation::RSL::CStateMachine::*",
    # Foundational concrete type blocks moved out of manual injection
    "crate::implementation::RSL::cconfiguration::{CConfiguration, ReplicaIndexValid}",
    "crate::implementation::RSL::cconstants::{CConstants, CReplicaConstants}",
    # Component block A moved out of manual injection
    "crate::implementation::RSL::acceptorimpl::CAcceptor",
    "crate::implementation::RSL::learnerimpl::CLearner",
    "crate::implementation::RSL::ElectionImpl::{CElectionState, COutstandingOperation, CRequestHeader}",
    # Component block B moved out of manual injection
    "crate::implementation::RSL::ExecutorImpl::{CExecutor, CIncompleteBatchTimer}",
    "crate::implementation::RSL::ProposerImpl::CProposer",
    "crate::implementation::RSL::ReplicaImpl::{CReplica, CScheduler, abstractify_clpacket, abstractify_crslio, abstractify_crslio_seq}",
    # Broadcast helpers (CBroadcast, OutboundPackets with verified loops)
    "crate::implementation::RSL::cbroadcast::*",
    "crate::implementation::RSL::cparameters::CParameters",
    # Upper bound helpers (CUpperBound has spec int field, CUpperBoundedAddition)
    "crate::implementation::common::upper_bound::*",
    "crate::implementation::common::upper_bound_i::*",
    # CRequestHeader comes from ElectionImpl re-export above
]

[extra_type_aliases]
# Shared concrete I/O alias consumed by generated/manual RSL modules.
"CRslIo" = "LIoOp<EndPoint, CMessage>"

[naming]
spec_prefix = "L"
exec_prefix = "C"
# RSL implementation uses u64 for all numeric types for marshalling compatibility
int_type = "u64"
nat_type = "u64"

[remapping]
# External types that don't follow L->C convention
"AbstractEndPoint" = "EndPoint"
"AppMessage" = "CAppMessage"
"AppState" = "CAppState"
"RequestBatch" = "CRequestBatch"
"ReplyCache" = "CReplyCache"
"OperationNumber" = "COperationNumber"
"Votes" = "CVotes"
"LearnerState" = "CLearnerState"
"LearnerTuple" = "CLearnerTuple"
# Enums without L-prefix
"Ballot" = "CBallot"
"Request" = "CRequest"
"Reply" = "CReply"
"Vote" = "CVote"
"ClockReading" = "CClockReading"
"RslMessage" = "CMessage"
"OutstandingOperation" = "COutstandingOperation"
"IncompleteBatchTimer" = "CIncompleteBatchTimer"
"ElectionState" = "CElectionState"
"UpperBound" = "u64"
# Packet types
"RslPacket" = "CPacket"

# RslMessage variant remappings (spec variant -> exec variant)
"RslMessageInvalid" = "CMessageInvalid"
"RslMessageRequest" = "CMessageRequest"
"RslMessage1a" = "CMessage1a"
"RslMessage1b" = "CMessage1b"
"RslMessage2a" = "CMessage2a"
"RslMessage2b" = "CMessage2b"
"RslMessageHeartbeat" = "CMessageHeartbeat"
"RslMessageReply" = "CMessageReply"
"RslMessageAppStateRequest" = "CMessageAppStateRequest"
"RslMessageAppStateSupply" = "CMessageAppStateSupply"
"RslMessageStartingPhase2" = "CMessageStartingPhase2"

# OutstandingOperation variant remappings
"OutstandingOpKnown" = "COutstandingOpKnown"
"OutstandingOpUnknown" = "COutstandingOpUnknown"

# IncompleteBatchTimer variant remappings
"IncompleteBatchTimerOn" = "CIncompleteBatchTimerOn"
"IncompleteBatchTimerOff" = "CIncompleteBatchTimerOff"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_proofs = true
generate_clone_up_to_view_simple = true
generate_unreachable_value_helper = true
# Custom imports for RSL types
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::seq::*;",
    "use vstd::{map::*, modes::*, seq_lib::*};",
    "use vstd::{set::*, set_lib::*};",
    "use std::collections::{HashMap, HashSet};",
    "use crate::common::collections::seq_is_unique_v::*;",
    "use crate::common::collections::seqs::*;",
    "use crate::common::collections::hashsets::HashSetWellFormed;",
    "use crate::common::framework::environment_s::{LIoOp, LPacket};",
    "use crate::common::native::io_s::{AbstractEndPoint, EndPoint};",
    "use crate::implementation::RSL::appinterface::{CAppStateIsAbstractable, CAppStateIsValid};",
    "use crate::implementation::common::generic_refinement::*;",
    "use crate::implementation::common::marshalling::*;",
    "use crate::protocol::RSL::environment::{RslIo, RslPacket};",
    "use crate::protocol::RSL::replica::LScheduler;",
    "use crate::protocol::RSL::types::*;",
    "use crate::protocol::RSL::parameters::*;",
    "use crate::protocol::RSL::configuration::*;",
    "use crate::protocol::RSL::constants::*;",
    "use crate::protocol::RSL::message::*;",
    "use crate::protocol::RSL::acceptor::*;",
    "use crate::protocol::RSL::learner::*;",
    "use crate::protocol::RSL::election::*;",
    "use crate::protocol::RSL::executor::*;",
    "use crate::protocol::RSL::proposer::*;",
    "use crate::protocol::RSL::replica::*;",
    "use crate::protocol::common::upper_bound::*;",
    "use crate::services::RSL::app_state_machine::*;",
]

# View overrides: per-field custom View expressions for complex type conversion.
# Key format: "SpecTypeName.field_name" -> custom view expression
# Used when a field needs deep conversion instead of simple `@` or `as int`.
[view_overrides]
# CAcceptor fields
"LAcceptor.votes" = "abstractify_cvotes(&self.votes)"
"LAcceptor.last_checkpointed_operation" = "self.last_checkpointed_operation@.map(|i, c: COperationNumber| AbstractifyCOperationNumberToOperationNumber(c))"
"LAcceptor.log_truncation_point" = "AbstractifyCOperationNumberToOperationNumber(self.log_truncation_point)"
# CLearner fields
"LLearner.unexecuted_learner_state" = "abstractify_clearnerstate(self.unexecuted_learner_state)"
# CExecutor fields
"LExecutor.ops_complete" = "self.ops_complete as int"
"LExecutor.reply_cache" = "abstractify_creplycache(&self.reply_cache)"
# CVote fields
"Vote.max_val" = "abstractify_crequestbatch(&self.max_val)"
# CLearnerTuple fields
"LearnerTuple.received_2b_message_senders" = "self.received_2b_message_senders@.map(|i:EndPoint| i@)"
"LearnerTuple.candidate_learned_value" = "abstractify_crequestbatch(&self.candidate_learned_value)"
# CParameters fields
"LParameters.max_integer_val" = "UpperBound::UpperBoundFinite{n: self.max_integer_val as int}"
# CConfiguration fields
"LConfiguration.clientIds" = "Set::<AbstractEndPoint>::empty()"
"LConfiguration.replica_ids" = "self.replica_ids@.map(|i, e:EndPoint| e@)"
# CReplicaConstants fields
"LReplicaConstants.my_index" = "self.my_index as int"
# CProposer fields (complex collection conversions)
"LProposer.request_queue" = "self.request_queue@.map(|i, r:CRequest| r.view())"
"LProposer.received_1b_packets" = "self.received_1b_packets@.map(|p:CPacket| p.view())"
"LProposer.highest_seqno_requested_by_client_this_view" = "Map::new(self.highest_seqno_requested_by_client_this_view@.dom().map(|k: EndPoint| k@), |ak: AbstractEndPoint| { let k = choose |k: EndPoint| self.highest_seqno_requested_by_client_this_view@.contains_key(k) && k@ == ak; self.highest_seqno_requested_by_client_this_view@[k] as int })"
# CElectionState fields
"ElectionState.current_view_suspectors" = "self.current_view_suspectors@.map(|u:u64| u as int)"
"ElectionState.requests_received_this_epoch" = "self.requests_received_this_epoch@.map(|i, r:CRequest| r.view())"
"ElectionState.requests_received_prev_epochs" = "self.requests_received_prev_epochs@.map(|i, r:CRequest| r.view())"

# Extra fields to add to generated exec types that don't exist in the spec.
# These are optimization/bookkeeping fields with default values.
# Key format: "ExecTypeName.field_name" -> "type = default_value"
[extra_fields]
# CAcceptor: track minimum vote operation number for efficient lookups
"CAcceptor.min_vote_opn" = "COperationNumber = 0"
# CProposer: track max operation numbers for efficient bounds
"CProposer.max_opn_with_proposal" = "COperationNumber = 0"
"CProposer.max_log_truncation_point" = "COperationNumber = 0"
# CElectionState: track request sets for deduplication
"CElectionState.cur_req_set" = "HashSet<CRequestHeader> = HashSet::new()"
"CElectionState.prev_req_set" = "HashSet<CRequestHeader> = HashSet::new()"

# Clone strategy per exec type.
# "derive" (default): uses #[derive(Clone)]
# "external_body": generates #[verifier(external_body)] impl Clone
# Types containing HashSet need external_body since Verus can't derive Clone for HashSet.
[clone_strategy]
# CLearnerTuple: re-exported from types_i.rs (has its own Clone impl)
"CElectionState" = "external_body"
"CProposer" = "external_body"

# Custom derives per exec type.
# Additional derive macros beyond what clone_strategy provides.
# Key: exec type name, Value: list of derive names
[custom_derives]
# CBallot needs Eq/Copy/PartialEq/Hash for use as HashMap keys and value comparisons
"CBallot" = ["Eq", "Copy", "PartialEq", "Hash"]
# CRequest needs PartialEq/Eq/Hash for deduplication and HashMap usage
"CRequest" = ["PartialEq", "Eq", "Hash"]
# CReply needs Eq/PartialEq/Hash for reply cache operations
"CReply" = ["Eq", "PartialEq", "Hash"]
# CVote needs Eq/PartialEq/Hash for vote comparison operations
"CVote" = ["Eq", "PartialEq", "Hash"]
# CParameters is small and should be copyable
"CParameters" = ["Copy"]
# CClockReading is a simple u64 wrapper
"CClockReading" = ["Copy"]

# Fields to skip during generation for specific exec types.
# These fields exist in the spec type but should NOT be generated in the exec type.
# Key: exec type name, Value: list of field names to skip
[skip_fields]
# LConfiguration.clientIds is a Set<AbstractEndPoint> in spec but CConfiguration drops it.
# The view_override provides Set::<AbstractEndPoint>::empty() for the View impl.
"CConfiguration" = ["clientIds"]

# Marshalable implementation generation for struct types.
# These types are currently defined via `define_struct_and_derive_marshalable!` macro
# in types_i.rs. The transpiler can generate equivalent `impl Marshalable` code.
# Field types must implement Marshalable (u64, bool, Vec<u8>, EndPoint, CBallot, etc.)
[[marshalable.types]]
name = "CBallot"
fields = [["seqno", "u64"], ["proposer_id", "u64"]]

[[marshalable.types]]
name = "CRequest"
fields = [["client", "EndPoint"], ["seqno", "u64"], ["request", "CAppMessage"]]

[[marshalable.types]]
name = "CReply"
fields = [["client", "EndPoint"], ["seqno", "u64"], ["reply", "CAppMessage"]]

[[marshalable.types]]
name = "CVote"
fields = [["max_value_bal", "CBallot"], ["max_val", "CRequestBatch"]]

# Enum types to generate Marshalable impls for.
# These types are currently defined via `define_enum_and_derive_marshalable!` macro.
# Tag values must match the #[tag = N] attributes in the source definitions.

[[marshalable.enums]]
name = "CAppMessage"
[[marshalable.enums.variants]]
name = "CAppIncrement"
tag = 0
[[marshalable.enums.variants]]
name = "CAppReply"
tag = 1
fields = [["response", "u64"]]
[[marshalable.enums.variants]]
name = "CAppInvalid"
tag = 2

[[marshalable.enums]]
name = "CMessage"
[[marshalable.enums.variants]]
name = "CMessageInvalid"
tag = 0
[[marshalable.enums.variants]]
name = "CMessageRequest"
tag = 1
fields = [["seqno_req", "u64"], ["val", "CAppMessage"]]
[[marshalable.enums.variants]]
name = "CMessage1a"
tag = 2
fields = [["bal_1a", "CBallot"]]
[[marshalable.enums.variants]]
name = "CMessage1b"
tag = 3
fields = [["bal_1b", "CBallot"], ["log_truncation_point", "COperationNumber"], ["votes", "CVotes"]]
[[marshalable.enums.variants]]
name = "CMessage2a"
tag = 4
fields = [["bal_2a", "CBallot"], ["opn_2a", "COperationNumber"], ["val_2a", "CRequestBatch"]]
[[marshalable.enums.variants]]
name = "CMessage2b"
tag = 5
fields = [["bal_2b", "CBallot"], ["opn_2b", "COperationNumber"], ["val_2b", "CRequestBatch"]]
[[marshalable.enums.variants]]
name = "CMessageHeartbeat"
tag = 6
fields = [["bal_heartbeat", "CBallot"], ["suspicious", "bool"], ["opn_ckpt", "COperationNumber"]]
[[marshalable.enums.variants]]
name = "CMessageReply"
tag = 7
fields = [["seqno_reply", "u64"], ["reply", "CAppMessage"]]
[[marshalable.enums.variants]]
name = "CMessageAppStateRequest"
tag = 8
fields = [["bal_state_req", "CBallot"], ["opn_state_req", "COperationNumber"]]
[[marshalable.enums.variants]]
name = "CMessageAppStateSupply"
tag = 9
fields = [["bal_state_supply", "CBallot"], ["opn_state_supply", "COperationNumber"], ["app_state", "CAppState"], ["reply_cache", "CReplyCache"]]
[[marshalable.enums.variants]]
name = "CMessageStartingPhase2"
tag = 10
fields = [["bal_2", "CBallot"], ["logTruncationPoint_2", "COperationNumber"]]
