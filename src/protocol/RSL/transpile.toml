# Configuration for transpiling RSL spec to implementation
# This configures the transpiler to match the existing RSL codebase conventions

# Functions to skip during transpilation (require manual implementation).
# These are functions with complex I/O dispatch patterns that cannot be
# automatically transpiled because they use pattern matching on enum variants
# from sequences (e.g., ios[0]->r where ios is Vec<CRslIo>).
skip_functions = [
    # I/O dispatch functions that match on RslIo enum variants
    "LReplicaNextReadClockAndProcessPacket",
    "LReplicaNextProcessPacketWithoutReadingClock",
    "LReplicaNextProcessPacket",
    # Helper that extracts clock from I/O sequence
    "SpontaneousClock",
]

# Primitive types that should NOT have valid() predicates generated.
# These are type aliases to primitive types (u64, HashMap, etc.) that don't have valid().
primitive_types = [
    # Type aliases to u64 (no valid() method)
    "OperationNumber",
    "COperationNumber",
    # Type aliases to HashMap (no valid() method)
    "Votes",
    "CVotes",
    "LearnerState",
    "CLearnerState",
    # Type aliases to Vec (no valid() method)
    "RequestBatch",
    "CRequestBatch",
    # Generated struct types that are clock readings
    "CClockReading",
    "ClockReading",
]

# Spec-only functions that should NOT have C-prefix added
# These are functions that only exist in the spec layer and have no exec implementation
# The transpiler will use their names as-is without adding C-prefix
spec_only_functions = [
    # Configuration validation (spec-only predicate)
    "WellFormedLConfiguration",
    # Upper bound comparisons (spec-only predicates)
    "LtUpperBound",
    "LeqUpperBound",
    # IO extraction helpers (spec-only)
    "ExtractSentPacketsFromIos",
    "SpontaneousIos",
    "SpontaneousClock",
    # Proposer state predicates (spec-only)
    "LProposerCanNominateUsingOperationNumber",
    "LAllAcceptorsHadNoProposal",
    # Executor helpers (spec-only, no exec implementation exists)
    "LRepliesAreReplyType",
    "RepliesAreReplyType",
]

[naming]
spec_prefix = "L"
exec_prefix = "C"
# RSL implementation uses u64 for all numeric types for marshalling compatibility
int_type = "u64"
nat_type = "u64"

[remapping]
# RSL-specific type mappings
"LAcceptor" = "CAcceptor"
"LProposer" = "CProposer"
"LLearner" = "CLearner"
"LExecutor" = "CExecutor"
"LReplica" = "CReplica"
"LReplicaConstants" = "CReplicaConstants"
"Ballot" = "CBallot"
"Vote" = "CVote"
"OperationNumber" = "COperationNumber"
"RslPacket" = "CPacket"
"RslMessage" = "CMessage"
# Message variant mappings (spec uses RslMessage* but exec uses CMessage*)
# Use full paths for matches! macro compatibility
"RslMessage1a" = "CMessage::CMessage1a"
"RslMessage1b" = "CMessage::CMessage1b"
"RslMessage2a" = "CMessage::CMessage2a"
"RslMessage2b" = "CMessage::CMessage2b"
"RslMessageHeartbeat" = "CMessage::CMessageHeartbeat"
"RslMessageReply" = "CMessage::CMessageReply"
"RslMessageRequest" = "CMessage::CMessageRequest"
"RslMessageAppStateRequest" = "CMessage::CMessageAppStateRequest"
"RslMessageAppStateSupply" = "CMessage::CMessageAppStateSupply"
"RslMessageStartingPhase2" = "CMessage::CMessageStartingPhase2"
"RslMessageInvalid" = "CMessage::CMessageInvalid"
# External types that don't follow L->C convention
"AbstractEndPoint" = "EndPoint"
"AppMessage" = "CAppMessage"
"RequestBatch" = "CRequestBatch"
# IO and Scheduler types
"RslIo" = "CRslIo"
"LScheduler" = "CScheduler"
# IO variant mappings (spec LIoOp variants -> concrete CRslIo variants)
# Use full paths for matches! macro compatibility
"Send" = "CRslIo::CSend"
"Receive" = "CRslIo::CReceive"
"TimeoutReceive" = "CRslIo::CTimeoutReceive"
"ReadClock" = "CRslIo::CReadClock"
# IncompleteBatchTimer enum variants
"IncompleteBatchTimerOff" = "CIncompleteBatchTimer::CIncompleteBatchTimerOff"
"IncompleteBatchTimerOn" = "CIncompleteBatchTimer::CIncompleteBatchTimerOn"
# OutstandingOperation enum variants
"OutstandingOpUnknown" = "COutstandingOperation::COutstandingOpUnknown"
"OutstandingOpKnown" = "COutstandingOperation::COutstandingOpKnown"
# UpperBound enum variants
"UpperBoundFinite" = "CUpperBound::CUpperBoundFinite"
"UpperBoundInfinite" = "CUpperBound::CUpperBoundInfinite"

# Method call mappings: spec functions that should become method calls in exec code
# Format: "SpecFuncName" = { method_name = "ExecMethodName", receiver_arg_index = N }
# receiver_arg_index is 0-based: the argument at this index becomes the receiver
[method_calls]
# LMinQuorumSize(config) -> config.CMinQuorumSize()
"LMinQuorumSize" = { method_name = "CMinQuorumSize", receiver_arg_index = 0 }
# GetReplicaIndex(id, config) -> config.CGetReplicaIndex(id)
# Note: argument order is swapped - id is first in spec but config is receiver
"GetReplicaIndex" = { method_name = "CGetReplicaIndex", receiver_arg_index = 1 }
# LReplicaConstantsValid(c) -> c.CReplicaConstantsValid()
"LReplicaConstantsValid" = { method_name = "CReplicaConstantsValid", receiver_arg_index = 0 }
# LElectionStateReflectExecutedRequestBatch(es, es_, val) -> es.CElectionStateReflectExecutedRequestBatch(val)
# Note: es_ is output, es is receiver, val is input
"ElectionStateReflectExecutedRequestBatch" = { method_name = "CElectionStateReflectExecutedRequestBatch", receiver_arg_index = 0 }

# Cross-module function paths for generated code
# Maps spec function base names to their qualified exec paths
[function_paths]
# broadcast_gen.rs
"BroadcastToEveryone" = "crate::generated::RSL::broadcast_gen::CBroadcastToEveryone"
# election_gen.rs
"ElectionStateInit" = "crate::generated::RSL::election_gen::CElectionStateInit"
"ElectionStateProcessHeartbeat" = "crate::generated::RSL::election_gen::CElectionStateProcessHeartbeat"
"ElectionStateCheckForViewTimeout" = "crate::generated::RSL::election_gen::CElectionStateCheckForViewTimeout"
"ElectionStateCheckForQuorumOfViewSuspicions" = "crate::generated::RSL::election_gen::CElectionStateCheckForQuorumOfViewSuspicions"
"ElectionStateReflectReceivedRequest" = "crate::generated::RSL::election_gen::CElectionStateReflectReceivedRequest"
# proposer_gen.rs
"ProposerInit" = "crate::generated::RSL::proposer_gen::CProposerInit"
"ProposerProcessRequest" = "crate::generated::RSL::proposer_gen::CProposerProcessRequest"
"ProposerMaybeEnterNewViewAndSend1a" = "crate::generated::RSL::proposer_gen::CProposerMaybeEnterNewViewAndSend1a"
"ProposerProcess1b" = "crate::generated::RSL::proposer_gen::CProposerProcess1b"
"ProposerMaybeEnterPhase2" = "crate::generated::RSL::proposer_gen::CProposerMaybeEnterPhase2"
"ProposerMaybeNominateValueAndSend2a" = "crate::generated::RSL::proposer_gen::CProposerMaybeNominateValueAndSend2a"
"ProposerProcessHeartbeat" = "crate::generated::RSL::proposer_gen::CProposerProcessHeartbeat"
"ProposerCheckForViewTimeout" = "crate::generated::RSL::proposer_gen::CProposerCheckForViewTimeout"
"ProposerCheckForQuorumOfViewSuspicions" = "crate::generated::RSL::proposer_gen::CProposerCheckForQuorumOfViewSuspicions"
"ProposerResetViewTimerDueToExecution" = "crate::generated::RSL::proposer_gen::CProposerResetViewTimerDueToExecution"
# acceptor_gen.rs
"AcceptorInit" = "crate::generated::RSL::acceptor_gen::CAcceptorInit"
"AcceptorProcess1a" = "crate::generated::RSL::acceptor_gen::CAcceptorProcess1a"
"AcceptorProcess2a" = "crate::generated::RSL::acceptor_gen::CAcceptorProcess2a"
"AcceptorProcessHeartbeat" = "crate::generated::RSL::acceptor_gen::CAcceptorProcessHeartbeat"
"AcceptorTruncateLog" = "crate::generated::RSL::acceptor_gen::CAcceptorTruncateLog"
# learner_gen.rs
"LearnerInit" = "crate::generated::RSL::learner_gen::CLearnerInit"
"LearnerProcess2b" = "crate::generated::RSL::learner_gen::CLearnerProcess2b"
"LearnerForgetDecision" = "crate::generated::RSL::learner_gen::CLearnerForgetDecision"
"LearnerForgetOperationsBefore" = "crate::generated::RSL::learner_gen::CLearnerForgetOperationsBefore"
# executor_gen.rs
"ExecutorInit" = "crate::generated::RSL::executor_gen::CExecutorInit"
"ExecutorGetDecision" = "crate::generated::RSL::executor_gen::CExecutorGetDecision"
"ExecutorExecute" = "crate::generated::RSL::executor_gen::CExecutorExecute"
"ExecutorProcessAppStateSupply" = "crate::generated::RSL::executor_gen::CExecutorProcessAppStateSupply"
"ExecutorProcessAppStateRequest" = "crate::generated::RSL::executor_gen::CExecutorProcessAppStateRequest"
"ExecutorProcessStartingPhase2" = "crate::generated::RSL::executor_gen::CExecutorProcessStartingPhase2"
"ExecutorProcessRequest" = "crate::generated::RSL::executor_gen::CExecutorProcessRequest"
# Associated functions on CProposer (manual implementations)
"SetOfMessage1bAboutBallot" = "CProposer::CSetOfMessage1bAboutBallot"
"ValIsHighestNumberedProposal" = "CProposer::CValIsHighestNumberedProposal"
"ExistsAcceptorHasProposalLargeThanOpn" = "CProposer::CExistsAcceptorHasProposalLargeThanOpn"
# Associated functions on CExecutor (manual implementations, recursive)
"ClientsInReplies" = "CExecutor::CClientsInReplies"
"GetPacketsFromReplies" = "CExecutor::CGetPacketsFromReplies"
"UpdateNewCache" = "CExecutor::CUpdateNewCache"
# App state machine
"AppInitialize" = "CAppStateInit"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
# RSL uses 'valid()' instead of 'well_formed()'
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
