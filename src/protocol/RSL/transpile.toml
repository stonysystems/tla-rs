# Configuration for transpiling RSL spec to implementation
# This configures the transpiler to match the existing RSL codebase conventions

[naming]
spec_prefix = "L"
exec_prefix = "C"

[remapping]
# RSL-specific type mappings
"LAcceptor" = "CAcceptor"
"LProposer" = "CProposer"
"LLearner" = "CLearner"
"LExecutor" = "CExecutor"
"LReplica" = "CReplica"
"LReplicaConstants" = "CReplicaConstants"
"Ballot" = "CBallot"
"Vote" = "CVote"
"OperationNumber" = "COperationNumber"
"RslPacket" = "CPacket"
"RslMessage" = "CMessage"
# Message variant mappings (spec uses RslMessage* but exec uses CMessage*)
"RslMessage1a" = "CMessage1a"
"RslMessage1b" = "CMessage1b"
"RslMessage2a" = "CMessage2a"
"RslMessage2b" = "CMessage2b"
"RslMessageHeartbeat" = "CMessageHeartbeat"
"RslMessageReply" = "CMessageReply"
"RslMessageRequest" = "CMessageRequest"
"RslMessageAppStateRequest" = "CMessageAppStateRequest"
"RslMessageAppStateSupply" = "CMessageAppStateSupply"
"RslMessageStartingPhase2" = "CMessageStartingPhase2"
# External types that don't follow L->C convention
"AbstractEndPoint" = "EndPoint"
"AppMessage" = "CAppMessage"
"RequestBatch" = "CRequestBatch"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
# RSL uses 'valid()' instead of 'well_formed()'
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
# Custom imports for RSL acceptor
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::map::*;",
    "use vstd::set::*;",
    "use std::collections::HashMap;",
    "use std::collections::HashSet;",
    "use crate::common::collections::sets::*;",
    "use crate::common::collections::hashsets::*;",
    "use crate::common::native::io_s::EndPoint;",
    "use crate::implementation::RSL::types_i::*;",
    "use crate::implementation::RSL::cconstants::*;",
    "use crate::implementation::RSL::cmessage::*;",
    "use crate::implementation::RSL::cbroadcast::*;",
    "use crate::implementation::RSL::acceptorimpl::CAcceptor;",
    "use crate::implementation::RSL::ProposerImpl::CProposer;",
    "use crate::implementation::RSL::learnerimpl::CLearner;",
    "use crate::implementation::RSL::ExecutorImpl::CExecutor;",
    "use crate::implementation::RSL::ReplicaImpl::CReplica;",
    "use crate::implementation::RSL::ElectionImpl::CElectionState;",
    "use crate::protocol::RSL::acceptor::*;",
    "use crate::protocol::RSL::proposer::*;",
    "use crate::protocol::RSL::learner::*;",
    "use crate::protocol::RSL::executor::*;",
    "use crate::protocol::RSL::replica::*;",
    "use crate::protocol::RSL::election::*;",
    "use crate::protocol::RSL::broadcast::*;",
    "use crate::protocol::RSL::types::*;",
]

# Module-specific configuration (for future use)
[modules.acceptor]
# Module-specific includes can override or extend the defaults
