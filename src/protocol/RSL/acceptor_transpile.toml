# Configuration for transpiling RSL acceptor spec to implementation

# Spec-only functions (must be at top level before any section)
spec_only_functions = [
    "LeqUpperBound",
    "BalLeq",
    "BalLt",
]

# Primitive types that map to *param as int in ensures clauses
# OperationNumber is remapped to u64 which is a primitive
primitive_types = [
    "OperationNumber",
]

# Type aliases for collections — skip valid() but use param@ not *param as int
# Votes/CVotes is Map<OperationNumber, Vote> / HashMap<u64, CVote>
skip_valid_types = ["Votes", "CVotes"]

# Vec fields — these use as usize indexing
vec_fields = ["last_checkpointed_operation"]

# HashMap fields for &key indexing (no helper generation)
hashmap_index_fields = ["votes"]

# Custom view expressions for types in ensures clauses
# Votes (= Map<int, Vote>) needs deep conversion from HashMap<u64, CVote>
[type_view_exprs]
"Votes" = "abstractify_cvotes({param})"

[naming]
spec_prefix = "L"
exec_prefix = "C"
# RSL implementation uses u64 for all numeric types for marshalling compatibility
int_type = "u64"
nat_type = "u64"

[remapping]
"LAcceptor" = "CAcceptor"
"LReplicaConstants" = "CReplicaConstants"
"Ballot" = "CBallot"
"RslPacket" = "CPacket"
"RslMessage" = "CMessage"
"RslMessage1a" = "CMessage1a"
"RslMessage1b" = "CMessage1b"
"RslMessage2a" = "CMessage2a"
"RslMessage2b" = "CMessage2b"
"RslMessageHeartbeat" = "CMessageHeartbeat"
"Vote" = "CVote"
"OperationNumber" = "u64"
# Votes is a type alias that should keep its CVotes name but skip valid()
"Votes" = "CVotes"

# Method call mappings: spec functions that become method calls
[method_calls]
"LReplicaConstantsValid" = { method_name = "CReplicaConstantsValid", receiver_arg_index = 0 }
"GetReplicaIndex" = { method_name = "CGetReplicaIndex", receiver_arg_index = 1, destructure_index = 1 }

# Function paths for cross-module calls
[function_paths]
"BroadcastToEveryone" = "crate::generated::RSL::broadcast_gen::CBroadcastToEveryone"

[extra_fields]
"CAcceptor.min_vote_opn" = "u64 = 0u64"

# Enum variant field → variant path mappings for -> destructuring in exec code
[arrow_variants]
"bal_1a" = "CMessage::CMessage1a"
"bal_1b" = "CMessage::CMessage1b"
"log_truncation_point" = "CMessage::CMessage1b"
"votes" = "CMessage::CMessage1b"
"bal_2a" = "CMessage::CMessage2a"
"opn_2a" = "CMessage::CMessage2a"
"val_2a" = "CMessage::CMessage2a"
"bal_2b" = "CMessage::CMessage2b"
"opn_2b" = "CMessage::CMessage2b"
"val_2b" = "CMessage::CMessage2b"
"bal_heartbeat" = "CMessage::CMessageHeartbeat"
"suspicious" = "CMessage::CMessageHeartbeat"
"opn_ckpt" = "CMessage::CMessageHeartbeat"
"seqno_req" = "CMessage::CMessageRequest"
"val" = "CMessage::CMessageRequest"
"seqno_reply" = "CMessage::CMessageReply"
"reply" = "CMessage::CMessageReply"
"bal_state_req" = "CMessage::CMessageAppStateRequest"
"opn_state_req" = "CMessage::CMessageAppStateRequest"
"bal_state_supply" = "CMessage::CMessageAppStateSupply"
"opn_state_supply" = "CMessage::CMessageAppStateSupply"
"app_state" = "CMessage::CMessageAppStateSupply"
"reply_cache" = "CMessage::CMessageAppStateSupply"
"bal_2" = "CMessage::CMessageStartingPhase2"
"logTruncationPoint_2" = "CMessage::CMessageStartingPhase2"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
# CAcceptor comes from types_gen.rs (includes optimization field min_vote_opn)
generate_inline_types = false
# Custom imports for acceptor module
# Note: Shared infrastructure types needed for CBallot, CMessage, etc.
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::map::*;",
    "use vstd::set::*;",
    "use vstd::std_specs::hash::KeysAdditionalSpecFns;",
    "use std::collections::HashMap;",
    "use crate::common::collections::sets::*;",
    "use crate::common::collections::vecs::*;",
    "use crate::common::native::io_s::EndPoint;",
    "use crate::generated::RSL::types_gen::*;",
    "use crate::implementation::RSL::cmessage::*;",
    "use crate::implementation::RSL::gen_helpers::{clone_cpacket_preserving_validity, outbound_packets_to_vec};",
    "use crate::implementation::RSL::types_i::abstractify_cvotes;",
    "use crate::implementation::RSL::cbroadcast::*;",
    "use crate::implementation::common::upper_bound_i::*;",
    "use crate::protocol::RSL::acceptor::*;",
    "use crate::protocol::RSL::types::*;",
    "use crate::protocol::common::upper_bound::*;",
]
