# Configuration for transpiling RSL replica spec to implementation

# Emit &mut self calling convention for CReplica methods (Phase 48)
mut_self_types = ["CReplica"]
mut_self_helpers = [
    "LAcceptorProcess1a",
    "LAcceptorProcess2a",
    "LAcceptorProcessHeartbeat",
    "LExecutorGetDecision",
    "LExecutorProcessAppStateRequest",
    "LExecutorProcessAppStateSupply",
    "LExecutorProcessRequest",
    "LExecutorProcessStartingPhase2",
    "LLearnerForgetDecision",
    "LLearnerForgetOperationsBefore",
    "LLearnerProcess2b",
    "LProposerCheckForQuorumOfViewSuspicions",
    "LProposerCheckForViewTimeout",
    "LProposerMaybeEnterNewViewAndSend1a",
    "LProposerMaybeEnterPhase2",
    "LProposerMaybeNominateValueAndSend2a",
    "LProposerProcessHeartbeat",
    "LProposerProcessRequest",
    "LProposerResetViewTimerDueToExecution",
    "LExecutorExecute",
]

# Primitive types that don't need valid() predicates
# OperationNumber is remapped to u64 which is a primitive
primitive_types = [
    "OperationNumber",
]

# Type aliases that are really Vec<T> — skip valid() since Vec doesn't have it
skip_valid_types = ["RequestBatch"]

# HashMap fields for &key indexing (no helper generation)
hashmap_index_fields = ["reply_cache", "unexecuted_learner_state"]

# HashSet fields — needed to distinguish .contains() on HashSet (supported in Verus)
# from .contains() on Vec (not supported, needs free function)
collection_fields = ["current_view_suspectors"]

# Vec fields — used for concat_vecs detection
vec_fields = ["last_checkpointed_operation"]

# Per-element ensures for Vec<CPacket> output parameters
vec_element_ensures = ["valid", "abstractable"]

# Functions to skip during transpilation (require manual implementation)
# Only IO dispatch + message dispatch + proof-block functions remain here.
# All action functions are now auto-transpiled with assume_postconditions.
skip_functions = [
    # Complex IO dispatch patterns with hand-written proof blocks
    "LReplicaNextReadClockAndProcessPacket",
    "LReplicaNextProcessPacketWithoutReadingClock",
    "LReplicaNextProcessPacket",
    "LReplicaNoReceiveNext",
    "LSchedulerNext",
    # Keep skipped so proof-fallback emits explicit external-body stubs.
    # The hand-written manual body has been retired.
    "LReplicaNextProcess1b",
    # Helpers with manual implementations (prevent buggy auto-generation)
    "ExtractSentPacketsFromIos",
    "SpontaneousClock",
    "SpontaneousIos",
    # Spec uses `exists |opn|` existential with complex branching — transpiler cannot
    # resolve the existential witness. Hand-written body in replica_gen.rs.
    "LReplicaNextSpontaneousTruncateLogBasedOnCheckpoints",
    "LReplicaNextProcessRequest",
    "LReplicaNextProcess2a",
    "LReplicaNextSpontaneousMaybeMakeDecision",
    "LReplicaNextSpontaneousMaybeExecute",
    "LReplicaNextReadClockMaybeSendHeartbeat",
    "LReplicaInit",
]

# Functions that should NOT generate stubs even with proof_fallback
# (they have manual implementations in replica_manual.rs or are spec-only)
no_stub_functions = [
    # Phase 42.8.c.2.iv.J.3.d: hand-written proofs the transpiler cannot generate
    # (broadcast use + explicit lemma calls). Skipped so regeneration keeps the
    # proven bodies instead of replacing them with `assume(false)` stubs.
    "LReplicaNextProcessRequest",
    "LReplicaNextProcess2a",
    "LReplicaNextSpontaneousMaybeMakeDecision",
    "LReplicaNextSpontaneousMaybeExecute",
    "LReplicaNextReadClockMaybeSendHeartbeat",
    "LReplicaInit",
    # Non-spec helpers provided by shared implementation helpers
    "ExtractSentPacketsFromIos",
    # Spec-only predicates (no exec implementation needed)
    "WellFormedLConfiguration",
    "LeqUpperBound",
    "LtUpperBound",
    "LReplicaConstantsValid",
    "SpontaneousIos",
    "SpontaneousClock",
    "IsLogTruncationPointValid",
]

# Spec-only functions that should NOT get C-prefix
# These are spec predicates referenced in preconditions but have no exec implementation
spec_only_functions = [
    "WellFormedLConfiguration",
    "LeqUpperBound",
    "LtUpperBound",
    "LReplicaConstantsValid",
    # Helpers annotated in automan (auto-skipped)
    "ExtractSentPacketsFromIos",
    "SpontaneousClock",
]

# Method call mappings
[method_calls]
"LMinQuorumSize" = { method_name = "CMinQuorumSize", receiver_arg_index = 0 }
"LReplicaConstantsValid" = { method_name = "CReplicaConstantsValid", receiver_arg_index = 0 }
"LAcceptorProcess1a" = { method_name = "CAcceptorProcess1a", receiver_arg_index = 0 }
"LAcceptorProcess2a" = { method_name = "CAcceptorProcess2a", receiver_arg_index = 0 }
"LAcceptorProcessHeartbeat" = { method_name = "CAcceptorProcessHeartbeat", receiver_arg_index = 0 }
"LExecutorGetDecision" = { method_name = "CExecutorGetDecision", receiver_arg_index = 0 }
"LExecutorProcessAppStateRequest" = { method_name = "CExecutorProcessAppStateRequest", receiver_arg_index = 0 }
"LExecutorProcessAppStateSupply" = { method_name = "CExecutorProcessAppStateSupply", receiver_arg_index = 0 }
"LExecutorProcessRequest" = { method_name = "CExecutorProcessRequest", receiver_arg_index = 0 }
"LExecutorProcessStartingPhase2" = { method_name = "CExecutorProcessStartingPhase2", receiver_arg_index = 0 }
"LLearnerForgetDecision" = { method_name = "CLearnerForgetDecision", receiver_arg_index = 0 }
"LLearnerForgetOperationsBefore" = { method_name = "CLearnerForgetOperationsBefore", receiver_arg_index = 0 }
"LLearnerProcess2b" = { method_name = "CLearnerProcess2b", receiver_arg_index = 0 }
"LProposerCheckForQuorumOfViewSuspicions" = { method_name = "CProposerCheckForQuorumOfViewSuspicions", receiver_arg_index = 0 }
"LProposerCheckForViewTimeout" = { method_name = "CProposerCheckForViewTimeout", receiver_arg_index = 0 }
"LProposerMaybeEnterNewViewAndSend1a" = { method_name = "CProposerMaybeEnterNewViewAndSend1a", receiver_arg_index = 0 }
"LProposerMaybeEnterPhase2" = { method_name = "CProposerMaybeEnterPhase2", receiver_arg_index = 0 }
"LProposerMaybeNominateValueAndSend2a" = { method_name = "CProposerMaybeNominateValueAndSend2a", receiver_arg_index = 0 }
"LProposerProcessHeartbeat" = { method_name = "CProposerProcessHeartbeat", receiver_arg_index = 0 }
"LProposerProcessRequest" = { method_name = "CProposerProcessRequest", receiver_arg_index = 0 }
"LProposerResetViewTimerDueToExecution" = { method_name = "CProposerResetViewTimerDueToExecution", receiver_arg_index = 0 }

[naming]
spec_prefix = "L"
exec_prefix = "C"
# RSL implementation uses u64 for all numeric types for marshalling compatibility
int_type = "u64"
nat_type = "u64"

[remapping]
"LReplica" = "CReplica"
"LScheduler" = "CScheduler"
"LReplicaConstants" = "CReplicaConstants"
"RslPacket" = "CPacket"
"RslIo" = "CRslIo"
"ClockReading" = "CClockReading"
"Ballot" = "CBallot"
"OperationNumber" = "u64"
"RslMessage" = "CMessage"
"RslMessage1a" = "CMessage::CMessage1a"
"RslMessage1b" = "CMessage::CMessage1b"
"RslMessage2a" = "CMessage::CMessage2a"
"RslMessage2b" = "CMessage::CMessage2b"
"RslMessageHeartbeat" = "CMessage::CMessageHeartbeat"
"RslMessageReply" = "CMessage::CMessageReply"
"RslMessageRequest" = "CMessage::CMessageRequest"
"RslMessageAppStateRequest" = "CMessage::CMessageAppStateRequest"
"RslMessageAppStateSupply" = "CMessage::CMessageAppStateSupply"
"RslMessageStartingPhase2" = "CMessage::CMessageStartingPhase2"
"RslMessageInvalid" = "CMessage::CMessageInvalid"

[variant_remapping]
"OutstandingOpUnknown" = "COutstandingOperation::COutstandingOpUnknown"
"OutstandingOpKnown" = "COutstandingOperation::COutstandingOpKnown"

[arrow_variants]
"bal_1a" = "CMessage::CMessage1a"
"bal_1b" = "CMessage::CMessage1b"
"log_truncation_point" = "CMessage::CMessage1b"
"votes" = "CMessage::CMessage1b"
"bal_2a" = "CMessage::CMessage2a"
"opn_2a" = "CMessage::CMessage2a"
"val_2a" = "CMessage::CMessage2a"
"bal_2b" = "CMessage::CMessage2b"
"opn_2b" = "CMessage::CMessage2b"
"val_2b" = "CMessage::CMessage2b"
"bal_heartbeat" = "CMessage::CMessageHeartbeat"
"suspicious" = "CMessage::CMessageHeartbeat"
"opn_ckpt" = "CMessage::CMessageHeartbeat"
"seqno_req" = "CMessage::CMessageRequest"
"val" = "CMessage::CMessageRequest"
"bal_state_req" = "CMessage::CMessageAppStateRequest"
"opn_state_req" = "CMessage::CMessageAppStateRequest"
"bal_state_supply" = "CMessage::CMessageAppStateSupply"
"opn_state_supply" = "CMessage::CMessageAppStateSupply"
"app_state" = "CMessage::CMessageAppStateSupply"
"reply_cache" = "CMessage::CMessageAppStateSupply"
"bal_2" = "CMessage::CMessageStartingPhase2"
"logTruncationPoint_2" = "CMessage::CMessageStartingPhase2"
"v" = "COutstandingOperation::COutstandingOpKnown"

# Inline expansion configuration for arithmetic helper functions.
[inline_expansions.LeqUpperBound]
spec_binary_op = "<="
strategy = "conditional_binary"
op = "<="
condition_arg = 1
condition_types = ["UpperBound", "CUpperBound"]

[inline_expansions.LtUpperBound]
spec_binary_op = "<"
strategy = "conditional_binary"
op = "<"
condition_arg = 1
condition_types = ["UpperBound", "CUpperBound"]

[inline_expansions.UpperBoundedAddition]
strategy = "owned_call"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
# Proofs not yet mature — trust postconditions via assume(false)
assume_postconditions = true
proven_functions = [
    "LReplicaNumActions",
    "LReplicaNextProcessInvalid",
    "LReplicaNextProcess1a",
    "LReplicaNextProcessStartingPhase2",
    "LReplicaNextProcess2b",
    "LReplicaNextProcessReply",
    "LReplicaNextProcessAppStateSupply",
    "LReplicaNextProcessAppStateRequest",
    "LReplicaNextProcessHeartbeat",
    "LReplicaNextSpontaneousMaybeEnterNewViewAndSend1a",
    "LReplicaNextSpontaneousMaybeEnterPhase2",
    "LReplicaNextReadClockMaybeNominateValueAndSend2a",
    "LReplicaNextReadClockCheckForViewTimeout",
    "LReplicaNextReadClockCheckForQuorumOfViewSuspicions",
    "LSchedulerInit",
]
# Types are defined in types_gen.rs; do not duplicate here
generate_inline_types = false
