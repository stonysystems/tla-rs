# Configuration for transpiling RSL replica spec to implementation

# Primitive types that don't need valid() predicates
# OperationNumber is remapped to u64 which is a primitive
primitive_types = [
    "OperationNumber",
]

# HashMap fields for &key indexing (no helper generation)
hashmap_index_fields = ["reply_cache", "unexecuted_learner_state"]

# Functions to skip during transpilation (require manual implementation)
skip_functions = [
    # Complex IO dispatch patterns that cannot be auto-transpiled
    "LReplicaNextReadClockAndProcessPacket",
    "LReplicaNextProcessPacketWithoutReadingClock",
    "LReplicaNextProcessPacket",
    "SpontaneousClock",
    # Complex existential with variable scope issues
    "LReplicaNextSpontaneousTruncateLogBasedOnCheckpoints",
    # Also skip ExtractSentPacketsFromIos - filter with indexed access
    "ExtractSentPacketsFromIos",
    # Calls skipped CExecutorExecute from executor module
    "LReplicaNextSpontaneousMaybeExecute",
]

# Spec-only functions that should NOT get C-prefix
spec_only_functions = [
    "WellFormedLConfiguration",
    "LeqUpperBound",
    "LtUpperBound",
    "LReplicaConstantsValid",
    # Skipped functions should not get C-prefix when referenced
    "ExtractSentPacketsFromIos",
    "SpontaneousClock",
    "LReplicaNextSpontaneousTruncateLogBasedOnCheckpoints",
    "LReplicaNextProcessPacket",
    "LReplicaNextSpontaneousMaybeExecute",
]

# Method call mappings
[method_calls]
"LMinQuorumSize" = { method_name = "CMinQuorumSize", receiver_arg_index = 0 }
"LReplicaConstantsValid" = { method_name = "CReplicaConstantsValid", receiver_arg_index = 0 }

[naming]
spec_prefix = "L"
exec_prefix = "C"
# RSL implementation uses u64 for all numeric types for marshalling compatibility
int_type = "u64"
nat_type = "u64"

[remapping]
"LReplica" = "CReplica"
"LScheduler" = "CScheduler"
"LReplicaConstants" = "CReplicaConstants"
"RslPacket" = "CPacket"
"RslIo" = "CRslIo"
"ClockReading" = "CClockReading"
"Ballot" = "CBallot"
"OperationNumber" = "u64"
"RslMessage" = "CMessage"
"RslMessage1a" = "CMessage::CMessage1a"
"RslMessage1b" = "CMessage::CMessage1b"
"RslMessage2a" = "CMessage::CMessage2a"
"RslMessage2b" = "CMessage::CMessage2b"
"RslMessageHeartbeat" = "CMessage::CMessageHeartbeat"
"RslMessageReply" = "CMessage::CMessageReply"
"RslMessageRequest" = "CMessage::CMessageRequest"
"RslMessageAppStateRequest" = "CMessage::CMessageAppStateRequest"
"RslMessageAppStateSupply" = "CMessage::CMessageAppStateSupply"
"RslMessageStartingPhase2" = "CMessage::CMessageStartingPhase2"
"RslMessageInvalid" = "CMessage::CMessageInvalid"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
# Types are defined in types_gen.rs; do not duplicate here
generate_inline_types = false
# Custom imports for replica module
# Note: Still need implementation imports for shared infrastructure types.
# Sub-module state types (CProposer, CAcceptor, CLearner, CExecutor, CElectionState)
# are needed from their respective Impl files until all modules are generated.
# ReplicaModel contains host-level models that orchestrate the sub-modules.
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::map::*;",
    "use vstd::set::*;",
    "use vstd::std_specs::hash::SetIterAdditionalSpecFns;",
    "use std::collections::HashMap;",
    "use std::collections::HashSet;",
    "use crate::common::collections::sets::*;",
    "use crate::common::collections::hashsets::*;",
    "use crate::common::native::io_s::EndPoint;",
    "use crate::generated::RSL::types_gen::*;",
    "use crate::generated::RSL::broadcast_gen::CBroadcastToEveryone;",
    "use crate::generated::RSL::proposer_gen::*;",
    "use crate::generated::RSL::acceptor_gen::*;",
    "use crate::generated::RSL::learner_gen::*;",
    "use crate::generated::RSL::executor_gen::*;",
    "use crate::generated::RSL::election_gen::*;",
    "use crate::implementation::RSL::cmessage::*;",
    "use crate::implementation::RSL::cbroadcast::*;",
    "use crate::implementation::common::upper_bound_i::*;",
    "use crate::implementation::common::upper_bound::CUpperBoundedAddition;",
    "use crate::protocol::RSL::replica::*;",
    "use crate::protocol::RSL::types::*;",
    "use crate::protocol::RSL::configuration::*;",
    "use crate::protocol::common::upper_bound::{LtUpperBound, LeqUpperBound};",
]
