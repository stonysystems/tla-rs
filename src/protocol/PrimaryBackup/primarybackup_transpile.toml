# Configuration for transpiling Primary-Backup spec to exec implementation

# Skip functions that contain existential quantifiers
skip_functions = [
    "LNext",
]

# Fields that are HashSet types (Set) requiring clone_hashset()
collection_fields = []

# Fields that are Vec types (Seq) requiring .clone()
vec_fields = []

# Fields that are non-Copy types requiring .clone()
clone_fields = ["role"]

# Maps clone_fields to their exec enum types for generating clone helpers
[clone_field_types]
"role" = "CNodeRole"

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[remapping]
"LState" = "CState"
"LConstants" = "CConstants"
"LNodeRole" = "CNodeRole"
"LPBMessage" = "CPBMessage"
# Prevent C-prefixing of message variant names
"Replicate" = "Replicate"
"Ack" = "Ack"

[variant_remapping]
"Primary" = "CNodeRole::Primary"
"Backup" = "CNodeRole::Backup"
"Inactive" = "CNodeRole::Inactive"

[method_calls]

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use crate::protocol::PrimaryBackup::types::*;",
    "use crate::protocol::PrimaryBackup::primarybackup::*;",
    "use crate::generated::PrimaryBackup::types_gen::*;",
]

[messages]
enum_name = "PrimaryBackupMessage"
doc_comment = "Primary-Backup protocol network messages."

[[messages.variants]]
name = "Replicate"
doc = "Primary sends replicate to backup."
fields = [["value", "u64"]]

[[messages.variants]]
name = "Ack"
doc = "Backup acknowledges replication."

[[messages.variants]]
name = "ClientRequest"
doc = "Client sends write request."
fields = [["value", "u64"]]
# Auto-generated from LNext — 8 actions
[scheduler]
next_fn = "LNext"
params = ["s", "s_", "c"]
action_count = 8

[[scheduler.actions]]
spec_name = "LPrimaryWrite"
exec_name = "CPrimaryWrite"
kind = "message_driven"
message_variant = "ClientRequest"
existential_params = [["val", "int"], ["sent_packets", "Seq<LPBMessage>"]]

[[scheduler.actions]]
spec_name = "LPrimarySendReplicate"
exec_name = "CPrimarySendReplicate"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LPBMessage>"]]

[[scheduler.actions]]
spec_name = "LBackupReceiveReplicate"
exec_name = "CBackupReceiveReplicate"
kind = "message_driven"
message_variant = "Replicate"
existential_params = [["val", "int"], ["sent_packets", "Seq<LPBMessage>"]]

[[scheduler.actions]]
spec_name = "LBackupSendAck"
exec_name = "CBackupSendAck"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LPBMessage>"]]

[[scheduler.actions]]
spec_name = "LPrimaryReceiveAck"
exec_name = "CPrimaryReceiveAck"
kind = "message_driven"
message_variant = "Ack"
existential_params = [["sent_packets", "Seq<LPBMessage>"]]

[[scheduler.actions]]
spec_name = "LPrimaryCommit"
exec_name = "CPrimaryCommit"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LPBMessage>"]]

[[scheduler.actions]]
spec_name = "LPrimaryFail"
exec_name = "CPrimaryFail"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LPBMessage>"]]

[[scheduler.actions]]
spec_name = "LBackupPromote"
exec_name = "CBackupPromote"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LPBMessage>"]]
