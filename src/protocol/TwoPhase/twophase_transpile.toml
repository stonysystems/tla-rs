# Configuration for transpiling Two-Phase Commit spec to exec implementation

# Skip functions that contain existential quantifiers or complex patterns
skip_functions = [
    "LNext",
]

# Primitive types that don't need valid() predicates
primitive_types = []

# Fields that are collection types (Set/Map) requiring clone_hashset()
collection_fields = ["tm_prepared", "rm_prepared", "rm_committed", "rm_aborted", "rm"]

# Enum fields that need clone helpers (not Copy types)
clone_fields = ["tm_state"]

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[remapping]
"LState" = "CState"
"LConstants" = "CConstants"
"LTMState" = "CTMState"
"LRMState" = "CRMState"

[clone_field_types]
"tm_state" = "CTMState"

[clone_strategy]
"CState" = "external_body"
"CConstants" = "external_body"

[variant_remapping]
"Init" = "CTMState::Init"
"Committed" = "CTMState::Committed"
"Aborted" = "CTMState::Aborted"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use std::collections::HashSet;",
    "use crate::protocol::TwoPhase::types::*;",
    "use crate::protocol::TwoPhase::twophase::*;",
    "use crate::generated::TwoPhase::types_gen::*;",
]
