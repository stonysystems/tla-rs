# Configuration for transpiling Two-Phase Commit spec to exec implementation

# Skip functions that contain existential quantifiers or complex patterns
skip_functions = [
    "LNext",
]

# Arc-wrap non-scalar fields of CState for O(1) clone (refcount bump)
arc_wrap_types = ["CState"]

# Emit &mut self calling convention for CState methods (Phase 48)
mut_self_types = ["CState"]

# Fields of CState that are Arc-wrapped (for translator struct construction)
[arc_wrap_fields]
CState = ["tm_prepared", "rm_prepared", "rm_committed", "rm_aborted"]

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use std::collections::HashSet;",
    "use crate::protocol::TwoPhase::types::*;",
    "use crate::protocol::TwoPhase::twophase::*;",
    "use crate::generated::TwoPhase::types_gen::*;",
]

[messages]
enum_name = "TwoPhaseMessage"
doc_comment = "Two-Phase Commit protocol network messages."

[[messages.variants]]
name = "Prepare"
doc = "TM sends prepare to all RMs."

[[messages.variants]]
name = "PreparedVote"
doc = "RM votes that it is prepared."
fields = [["rm_id", "u64"]]

[[messages.variants]]
name = "Commit"
doc = "TM broadcasts commit decision."

[[messages.variants]]
name = "Abort"
doc = "TM broadcasts abort decision."
# Auto-generated from LNext — 8 actions
[scheduler]
next_fn = "LNext"
params = ["s", "s_", "c"]
action_count = 8

[[scheduler.actions]]
spec_name = "LTMSendPrepare"
exec_name = "CTMSendPrepare"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LTPCMessage>"]]

[[scheduler.actions]]
spec_name = "LRMReceivePrepare"
exec_name = "CRMReceivePrepare"
kind = "message_driven"
message_variant = "Prepare"
existential_params = [["rm", "int"], ["sent_packets", "Seq<LTPCMessage>"]]

[[scheduler.actions]]
spec_name = "LRMAbort"
exec_name = "CRMAbort"
kind = "timer_driven"
existential_params = [["rm", "int"], ["sent_packets", "Seq<LTPCMessage>"]]

[[scheduler.actions]]
spec_name = "LTMRcvPrepared"
exec_name = "CTMRcvPrepared"
kind = "message_driven"
message_variant = "PreparedVote"
existential_params = [["r", "int"], ["sent_packets", "Seq<LTPCMessage>"]]

[[scheduler.actions]]
spec_name = "LTMSendCommit"
exec_name = "CTMSendCommit"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LTPCMessage>"]]

[[scheduler.actions]]
spec_name = "LTMSendAbort"
exec_name = "CTMSendAbort"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LTPCMessage>"]]

[[scheduler.actions]]
spec_name = "LRMReceiveCommit"
exec_name = "CRMReceiveCommit"
kind = "message_driven"
message_variant = "Commit"
existential_params = [["rm", "int"], ["sent_packets", "Seq<LTPCMessage>"]]

[[scheduler.actions]]
spec_name = "LRMReceiveAbort"
exec_name = "CRMReceiveAbort"
kind = "message_driven"
message_variant = "Abort"
existential_params = [["rm", "int"], ["sent_packets", "Seq<LTPCMessage>"]]
