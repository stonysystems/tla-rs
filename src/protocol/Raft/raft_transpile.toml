# Configuration for transpiling Raft Consensus spec to exec implementation

# Skip functions that contain complex inline if/else or existential quantifiers.
# Composite handlers (Phase 27) are implemented manually in host.rs since they
# call atomic functions with requires preconditions that need runtime guard checks.
skip_functions = [
    "LNext",
]

# MembershipPhase is the proof-only set representation. Its executable
# sequence-backed counterpart is LMembershipPhase; generating both would map
# both names to CMembershipPhase.
skip_types = ["MembershipPhase"]

# CState has a custom validity predicate for its optional executable phase.
skip_validity_types = ["CState"]

# Spec-only functions (no C-prefix in requires clauses)
spec_only_functions = ["replicator_count", "ae_entry_count"]

# Message type for sent_packets Vec proof helpers (generates lemma_empty_msg_map)
msg_vec_type = ["CRaftMessage", "LRaftMessage"]

# HashSet fields for cardinality bridge proof injection
set_fields = ["votes_granted", "servers"]

# Arc-wrap non-scalar fields of CState for O(1) clone.
# NOTE (Phase 50): Raft does NOT use the &mut self calling convention.
# Several message handlers (CHandleRequestVoteMsg, CHandleAppendEntriesMsg, ...)
# compute an intermediate functional state `s_mid = step_down_if_needed(s, term)`
# and then return it (or grant-vote from it). The &mut self body transform cannot
# rewrite that intermediate-state pattern into `*self = s_mid; return msgs`, so
# Raft stays on the functional (returns-new-CState) convention, which verifies and
# compiles. Arc-wrapping keeps the functional clone O(1). Revisit if the transpiler
# learns to lift intermediate functional state into self-assignment.
arc_wrap_types = ["CState"]

[arc_wrap_fields]
CState = ["log", "votes_granted", "match_index", "next_index"]

# Extra requires clauses per exec function (transpiler can't derive these from spec)
[extra_requires]
"CClientRequest" = ["s.role is Leader"]
"CGrantVote" = [
    "*candidate_term >= s.current_term",
    "!s.has_voted || s.voted_for == *candidate_id",
    """({
        let last_log_term: int = if s.log@.len() == 0 { 0int } else { s.log@[s.log@.len() - 1].term as int };
        *candidate_last_log_term as int > last_log_term
            || (*candidate_last_log_term as int == last_log_term
                && *candidate_last_log_index as int >= s.log@.len())
    })""",
]
"CFollowerAppendEntries" = [
    "*ae_term >= s.current_term",
    "s.log@.len() < u64::MAX as int",
]
"CHandleAppendEntriesMsg" = [
    "s.log@.len() < u64::MAX as int",
]
"CHandleAppendResponseMsg" = [
    "s.log@.len() < u64::MAX as int",
]
"CHandleMessage" = [
    "s.log@.len() < u64::MAX as int",
]
"CHandleAppendResponse" = [
    "*new_match_index < u64::MAX",
]
"CTryAdvanceCommitIndex" = [
    """(!(s.role is Leader) || *new_commit_index <= s.commit_index) || (
        *new_commit_index as int <= s@.log.len()
        && s.log@[*new_commit_index as int - 1].term == s.current_term
    )""",
]
"CAdvanceCommitIndex" = [
    "s.role is Leader",
    "(*new_commit_index > s.commit_index)",
    "(*new_commit_index as int <= s@.log.len())",
    "s.log@[*new_commit_index as int - 1].term == s.current_term",
]

# Raft CState has Vec<CLogEntry> and HashMap<u64,u64> fields whose .clone()
# doesn't have verified `ensures res@ == self@` in Verus (generic Clone limitation).
# CConstants only has HashSet<u64> and can use verified clone.
[clone_strategy]
"CState" = "external_body"
"CMembershipConfig" = "manual"
"CMembershipPhase" = "manual"
"CLogValue" = "manual"
"CLogEntry" = "manual"
"CRaftMessage" = "manual"
"CRaftPacket" = "manual"

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[remapping]
"Option" = "Option"

[view_overrides]
"LState.election_membership_phase" = """match self.election_membership_phase {
    Some(phase) => Some(membership_phase_view(phase@)),
    None => None,
}"""

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
types_manual_code = "raft_types_manual.rs"
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use vstd::set_lib::*;",
    "use std::collections::HashSet;",
    "use std::collections::HashMap;",
    "use crate::protocol::Raft::types::*;",
    "use crate::protocol::Raft::raft::*;",
    "use crate::protocol::Raft::membership::*;",
    "use crate::generated::Raft::types_gen::*;",
    "use crate::implementation::Raft::helpers::*;",
    "use crate::implementation::Raft::membership_helpers::*;",
]

[messages]
enum_name = "RaftMessage"
doc_comment = "Raft Consensus protocol network messages."

[[messages.variants]]
name = "RequestVote"
doc = "Candidate requests votes from peers during an election."
fields = [["term", "u64"], ["candidate_id", "u64"], ["last_log_index", "u64"], ["last_log_term", "u64"]]

[[messages.variants]]
name = "VoteResponse"
doc = "Follower responds to a vote request."
fields = [["term", "u64"], ["granted", "bool"], ["voter", "u64"], ["voter_last_log_index", "u64"], ["voter_last_log_term", "u64"]]

[[messages.variants]]
name = "AppendEntries"
doc = "Leader sends log entries (or heartbeats) to followers."
fields = [["term", "u64"], ["leader_id", "u64"], ["prev_log_index", "u64"], ["prev_log_term", "u64"], ["value", "u64"], ["payload", "CLogValue"], ["has_entry", "bool"], ["leader_commit", "u64"]]

[[messages.variants]]
name = "AppendResponse"
doc = "Follower responds to an append entries request."
fields = [["term", "u64"], ["success", "bool"], ["match_index", "u64"], ["follower", "u64"]]

[[messages.variants]]
name = "ClientRequest"
doc = "External client submits a request to the cluster."
fields = [["client_id", "u64"], ["seq_no", "u64"], ["value", "u64"]]

[[messages.variants]]
name = "ClientResponse"
doc = "Server responds to a client request."
fields = [["client_id", "u64"], ["seq_no", "u64"], ["success", "bool"]]
# The executable scheduler covers five branches. LAppendConfigurationEntry
# remains a spec-level action until native Configuration serialization exists.
[scheduler]
next_fn = "LNext"
params = ["s", "s_", "c"]
action_count = 5

[[scheduler.actions]]
spec_name = "LTimeout"
exec_name = "CTimeout"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LClientRequest"
exec_name = "CClientRequest"
kind = "timer_driven"
existential_params = [["value", "int"], ["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LSendAppendEntries"
exec_name = "CSendAppendEntries"
kind = "timer_driven"
existential_params = [["follower", "int"], ["entry_value", "int"], ["entry_payload", "LLogValue"], ["prev_log_index", "int"], ["prev_log_term", "int"], ["has_entry", "bool"], ["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LHandleMessage"
exec_name = "CHandleMessage"
kind = "message_driven"
existential_params = [["msg", "LRaftMessage"], ["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LTryAdvanceCommitIndex"
exec_name = "CTryAdvanceCommitIndex"
kind = "timer_driven"
existential_params = [["new_commit_index", "int"], ["sent_packets", "Seq<LRaftMessage>"]]
