# Configuration for transpiling Raft Consensus spec to exec implementation

# Skip functions that contain complex inline if/else or existential quantifiers
skip_functions = [
    "LNext",
]

# Extra requires clauses per exec function (transpiler can't derive these from spec)
[extra_requires]
"CClientRequest" = ["s.role is Leader"]
"CGrantVote" = [
    "*candidate_term >= s.current_term",
    "!s.has_voted || s.voted_for == *candidate_id",
    """({
        let last_log_term: int = if s.log@.len() == 0 { 0int } else { s.log@[s.log@.len() - 1].term as int };
        *candidate_last_log_term as int > last_log_term
            || (*candidate_last_log_term as int == last_log_term
                && *candidate_last_log_index as int >= s.log@.len())
    })""",
]
"CFollowerAppendEntries" = [
    "s.log@.len() < u64::MAX as int",
]
"CHandleAppendResponse" = [
    "*new_match_index < u64::MAX",
]
"CAdvanceCommitIndex" = [
    "s.role is Leader",
    "(*new_commit_index > s.commit_index)",
    "(*new_commit_index as int <= s@.log.len())",
    "s.log@[*new_commit_index as int - 1].term == s.current_term",
]

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use vstd::set_lib::*;",
    "use std::collections::HashSet;",
    "use std::collections::HashMap;",
    "use crate::protocol::Raft::types::*;",
    "use crate::protocol::Raft::raft::*;",
    "use crate::generated::Raft::types_gen::*;",
    "use crate::implementation::Raft::helpers::*;",
]

[messages]
enum_name = "RaftMessage"
doc_comment = "Raft Consensus protocol network messages."

[[messages.variants]]
name = "RequestVote"
doc = "Candidate requests votes from peers during an election."
fields = [["term", "u64"], ["candidate_id", "u64"], ["last_log_index", "u64"], ["last_log_term", "u64"]]

[[messages.variants]]
name = "VoteResponse"
doc = "Follower responds to a vote request."
fields = [["term", "u64"], ["granted", "bool"], ["voter", "u64"]]

[[messages.variants]]
name = "AppendEntries"
doc = "Leader sends log entries (or heartbeats) to followers."
fields = [["term", "u64"], ["leader_id", "u64"], ["prev_log_index", "u64"], ["prev_log_term", "u64"], ["value", "u64"], ["has_entry", "bool"], ["leader_commit", "u64"]]

[[messages.variants]]
name = "AppendResponse"
doc = "Follower responds to an append entries request."
fields = [["term", "u64"], ["success", "bool"], ["match_index", "u64"], ["follower", "u64"]]

[[messages.variants]]
name = "ClientRequest"
doc = "External client submits a request to the cluster."
fields = [["client_id", "u64"], ["seq_no", "u64"], ["value", "u64"]]

[[messages.variants]]
name = "ClientResponse"
doc = "Server responds to a client request."
fields = [["client_id", "u64"], ["seq_no", "u64"], ["success", "bool"]]
# Auto-generated from LNext — 11 actions
[scheduler]
next_fn = "LNext"
params = ["s", "s_", "c"]
action_count = 11
# GrantVote and FollowerAppendEntries are responses to incoming messages
message_response_overrides = ["GrantVote", "FollowerAppendEntries"]
# HandleAppendReject is a failure sub-case, not a direct message handler
timer_overrides = ["HandleAppendReject"]

[[scheduler.actions]]
spec_name = "LTimeout"
exec_name = "CTimeout"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LGrantVote"
exec_name = "CGrantVote"
kind = "message_driven"
message_variant = "RequestVote"
existential_params = [["candidate_term", "int"], ["candidate_last_log_term", "int"], ["candidate_last_log_index", "int"], ["candidate_id", "int"], ["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LReceiveVoteGranted"
exec_name = "CReceiveVoteGranted"
kind = "message_driven"
message_variant = "VoteResponse"
existential_params = [["vote_term", "int"], ["vote_granted", "bool"], ["voter", "int"], ["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LBecomeLeader"
exec_name = "CBecomeLeader"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LClientRequest"
exec_name = "CClientRequest"
kind = "timer_driven"
existential_params = [["value", "int"], ["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LSendAppendEntries"
exec_name = "CSendAppendEntries"
kind = "timer_driven"
existential_params = [["follower", "int"], ["entry_value", "int"], ["prev_log_index", "int"], ["prev_log_term", "int"], ["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LFollowerAppendEntries"
exec_name = "CFollowerAppendEntries"
kind = "message_driven"
message_variant = "AppendEntries"
existential_params = [["ae_term", "int"], ["ae_leader", "int"], ["ae_prev_index", "int"], ["ae_prev_term", "int"], ["ae_value", "int"], ["ae_has_entry", "bool"], ["ae_leader_commit", "int"], ["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LHandleAppendResponse"
exec_name = "CHandleAppendResponse"
kind = "message_driven"
message_variant = "AppendResponse"
existential_params = [["resp_term", "int"], ["resp_success", "bool"], ["resp_match_index", "int"], ["resp_follower", "int"], ["follower", "u64"], ["new_match_index", "u64"], ["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LHandleAppendReject"
exec_name = "CHandleAppendReject"
kind = "timer_driven"
existential_params = [["resp_term", "int"], ["resp_success", "bool"], ["resp_match_index", "int"], ["resp_follower", "int"], ["follower", "u64"], ["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LAdvanceCommitIndex"
exec_name = "CAdvanceCommitIndex"
kind = "timer_driven"
existential_params = [["new_commit_index", "int"], ["sent_packets", "Seq<LRaftMessage>"]]

[[scheduler.actions]]
spec_name = "LStepDown"
exec_name = "CStepDown"
kind = "timer_driven"
existential_params = [["new_term", "int"], ["sent_packets", "Seq<LRaftMessage>"]]
