# Configuration for transpiling Raft Consensus spec to exec implementation

# Skip functions that contain complex inline if/else or existential quantifiers
skip_functions = [
    "LNext",
]

# Primitive types that don't need valid() predicates
primitive_types = []

# Fields that are HashSet types (Set) requiring clone_hashset()
collection_fields = ["votes_granted", "servers"]

# Fields that are Vec/HashMap types (Seq/Map) requiring .clone()
vec_fields = ["match_index", "next_index"]

# Fields that are HashMap-typed and need &key indexing (not abstractify helpers)
hashmap_index_fields = ["match_index", "next_index"]

# Fields that are non-Copy types requiring .clone() but not @ in view
clone_fields = ["role"]

# Maps clone_fields to their exec enum types for generating clone helpers
[clone_field_types]
"role" = "CServerRole"

# Maps struct-typed Vec field names to [exec_element_type, spec_element_type]
# Generates clone_log wrapper, lemma_empty_log_map, lemma_log_push_map_commute
[struct_vec_fields]
"log" = ["CLogEntry", "LLogEntry"]

# Extra requires clauses per exec function (transpiler can't derive these from spec)
[extra_requires]
"CClientRequest" = ["s.role is Leader"]
"CGrantVote" = [
    "*candidate_term >= s.current_term",
    "!s.has_voted || s.voted_for == *candidate_id",
    """({
        let last_log_term: int = if s.log@.len() == 0 { 0int } else { s.log@[s.log@.len() - 1].term as int };
        *candidate_last_log_term as int > last_log_term
            || (*candidate_last_log_term as int == last_log_term
                && *candidate_last_log_index as int >= s.log@.len())
    })""",
]
"CHandleAppendResponse" = [
    "*new_match_index < u64::MAX",
]
"CAdvanceCommitIndex" = [
    "s.role is Leader",
    "(*new_commit_index > s.commit_index)",
    "(*new_commit_index as int <= s@.log.len())",
    "s.log@[*new_commit_index as int - 1].term == s.current_term",
]

[clone_strategy]
"CState" = "external_body"
"CConstants" = "external_body"

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[remapping]
"LState" = "CState"
"LConstants" = "CConstants"
"LServerRole" = "CServerRole"
"LLogEntry" = "CLogEntry"

[variant_remapping]
"Follower" = "CServerRole::Follower"
"Candidate" = "CServerRole::Candidate"
"Leader" = "CServerRole::Leader"

[output]
manual_code = "manual_helpers.rs"
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use vstd::set_lib::*;",
    "use std::collections::HashSet;",
    "use std::collections::HashMap;",
    "use crate::protocol::Raft::types::*;",
    "use crate::protocol::Raft::raft::*;",
    "use crate::generated::Raft::types_gen::*;",
]
