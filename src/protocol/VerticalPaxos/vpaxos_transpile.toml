# Configuration for transpiling Vertical Paxos spec to exec implementation

# Skip functions that contain existential quantifiers
skip_functions = [
    "LNext",
]

# Arc-wrap non-scalar fields of CState for O(1) clone
# Emit &mut self calling convention for CState methods (Phase 48)
# Phase 50: reverted to functional convention -- the &mut self proof codegen
# leaves postcondition gaps for this protocol. No perf need (unbenchmarked).
# mut_self_types = ["CState"]

arc_wrap_types = ["CState"]

[arc_wrap_fields]
CState = ["promises_rcvd", "accepts_rcvd"]

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use std::collections::HashSet;",
    "use crate::protocol::VerticalPaxos::types::*;",
    "use crate::protocol::VerticalPaxos::vpaxos::*;",
    "use crate::generated::VerticalPaxos::types_gen::*;",
]

[messages]
enum_name = "VerticalPaxosMessage"
doc_comment = "Vertical Paxos protocol network messages."

[[messages.variants]]
name = "Prepare"
doc = "Phase 1a: Proposer sends Prepare."
fields = [["ballot", "u64"]]

[[messages.variants]]
name = "Promise"
doc = "Phase 1b: Acceptor promises with accepted ballot/value."
fields = [["ballot", "u64"], ["v_bal", "u64"], ["val", "u64"], ["sender", "u64"]]

[[messages.variants]]
name = "Accept"
doc = "Phase 2a: Proposer sends Accept."
fields = [["ballot", "u64"], ["value", "u64"]]

[[messages.variants]]
name = "AcceptOk"
doc = "Phase 2b: Acceptor confirms acceptance."
fields = [["sender", "u64"]]

[[messages.variants]]
name = "Commit"
doc = "Commit notification."
fields = [["value", "u64"]]

[[messages.variants]]
name = "Sync"
doc = "Reconfiguration sync message."
fields = [["config", "u64"], ["value", "u64"]]
# Auto-generated from LNext — 10 actions
[scheduler]
next_fn = "LNext"
params = ["s", "s_", "c"]
action_count = 10
# SendPromise responds to Prepare; WitnessSync/Sync are sync-protocol message handlers
message_response_overrides = ["SendPromise", "WitnessSync", "Sync"]

[[scheduler.actions]]
spec_name = "LPrepare"
exec_name = "CPrepare"
kind = "timer_driven"
existential_params = [["b", "int"], ["sent_packets", "Seq<LVPMessage>"]]

[[scheduler.actions]]
spec_name = "LSendPromise"
exec_name = "CSendPromise"
kind = "message_driven"
message_variant = "Prepare"
existential_params = [["prepare_bal", "int"], ["sent_packets", "Seq<LVPMessage>"]]

[[scheduler.actions]]
spec_name = "LReceivePromise"
exec_name = "CReceivePromise"
kind = "message_driven"
message_variant = "Promise"
existential_params = [["sender", "int"], ["promise_bal", "int"], ["promise_v_bal", "int"], ["promise_val", "int"], ["sent_packets", "Seq<LVPMessage>"]]

[[scheduler.actions]]
spec_name = "LAccept"
exec_name = "CAccept"
kind = "timer_driven"
existential_params = [["b", "int"], ["v", "int"], ["sent_packets", "Seq<LVPMessage>"]]

[[scheduler.actions]]
spec_name = "LReceiveAccepted"
exec_name = "CReceiveAccepted"
kind = "message_driven"
message_variant = "Accept"
existential_params = [["sender", "int"], ["accept_bal", "int"], ["sent_packets", "Seq<LVPMessage>"]]

[[scheduler.actions]]
spec_name = "LCommit"
exec_name = "CCommit"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LVPMessage>"]]

[[scheduler.actions]]
spec_name = "LReconfigure"
exec_name = "CReconfigure"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LVPMessage>"]]

[[scheduler.actions]]
spec_name = "LWitnessSync"
exec_name = "CWitnessSync"
kind = "message_driven"
message_variant = "Sync"
existential_params = [["witness_val", "int"], ["sent_packets", "Seq<LVPMessage>"]]

[[scheduler.actions]]
spec_name = "LSync"
exec_name = "CSync"
kind = "message_driven"
message_variant = "Sync"
existential_params = [["new_config", "int"], ["val", "int"], ["sent_packets", "Seq<LVPMessage>"]]

[[scheduler.actions]]
spec_name = "LDeactivate"
exec_name = "CDeactivate"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LVPMessage>"]]
