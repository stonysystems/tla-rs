# Configuration for transpiling PBFT spec to exec implementation

# Skip functions that contain existential quantifiers
skip_functions = [
    "LNext",
]

# Arc-wrap non-scalar fields of CState for O(1) clone
arc_wrap_types = ["CState"]

[arc_wrap_fields]
CState = ["prepare_senders", "commit_senders"]

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use std::collections::HashSet;",
    "use crate::protocol::PBFT::types::*;",
    "use crate::protocol::PBFT::pbft::*;",
    "use crate::generated::PBFT::types_gen::*;",
]

[messages]
enum_name = "PBFTMessage"
doc_comment = "PBFT consensus protocol network messages."

[[messages.variants]]
name = "PrePrepare"
doc = "Primary broadcasts a pre-prepare for a client request."
fields = [["view", "u64"], ["seq", "u64"], ["digest", "u64"]]

[[messages.variants]]
name = "Prepare"
doc = "Replica sends a prepare message to all peers."
fields = [["view", "u64"], ["seq", "u64"], ["digest", "u64"], ["sender", "u64"]]

[[messages.variants]]
name = "Commit"
doc = "Replica sends a commit message to all peers."
fields = [["view", "u64"], ["seq", "u64"], ["sender", "u64"]]

[[messages.variants]]
name = "ClientRequest"
doc = "Client sends a request to the primary."
fields = [["digest", "u64"]]

[[messages.variants]]
name = "ClientReply"
doc = "Reply sent to client after executing a committed request."
fields = [["digest", "u64"]]
# Auto-generated from LNext — 9 actions
[scheduler]
next_fn = "LNext"
params = ["s", "s_", "c"]
action_count = 9

[[scheduler.actions]]
spec_name = "LPrePrepare"
exec_name = "CPrePrepare"
kind = "timer_driven"
existential_params = [["digest", "int"], ["sent_packets", "Seq<LPBFTMessage>"]]

[[scheduler.actions]]
spec_name = "LReceivePrePrepare"
exec_name = "CReceivePrePrepare"
kind = "message_driven"
message_variant = "PrePrepare"
existential_params = [["view", "int"], ["seq", "int"], ["digest", "int"], ["sent_packets", "Seq<LPBFTMessage>"]]

[[scheduler.actions]]
spec_name = "LReceivePrepare"
exec_name = "CReceivePrepare"
kind = "message_driven"
message_variant = "Prepare"
existential_params = [["sender", "int"], ["sent_packets", "Seq<LPBFTMessage>"]]

[[scheduler.actions]]
spec_name = "LEnterCommit"
exec_name = "CEnterCommit"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LPBFTMessage>"]]

[[scheduler.actions]]
spec_name = "LReceiveCommit"
exec_name = "CReceiveCommit"
kind = "message_driven"
message_variant = "Commit"
existential_params = [["sender", "int"], ["sent_packets", "Seq<LPBFTMessage>"]]

[[scheduler.actions]]
spec_name = "LExecuteReply"
exec_name = "CExecuteReply"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LPBFTMessage>"]]

[[scheduler.actions]]
spec_name = "LCheckpoint"
exec_name = "CCheckpoint"
kind = "timer_driven"
existential_params = [["digest", "int"], ["sent_packets", "Seq<LPBFTMessage>"]]

[[scheduler.actions]]
spec_name = "LViewChange"
exec_name = "CViewChange"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LPBFTMessage>"]]

[[scheduler.actions]]
spec_name = "LNewRound"
exec_name = "CNewRound"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LPBFTMessage>"]]
