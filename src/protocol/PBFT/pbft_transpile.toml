# Configuration for transpiling PBFT spec to exec implementation

# Skip functions that contain existential quantifiers
skip_functions = [
    "LNext",
]

# Fields that are HashSet types (Set) requiring clone_hashset()
collection_fields = ["prepare_senders", "commit_senders"]

# Fields that are Vec types (Seq) requiring .clone()
vec_fields = []

# Fields that are non-Copy types requiring .clone()
clone_fields = ["phase"]

# Maps clone_fields to their exec enum types for generating clone helpers
[clone_field_types]
"phase" = "CPhase"

[clone_strategy]
"CState" = "external_body"

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[remapping]
"LState" = "CState"
"LConstants" = "CConstants"
"LPhase" = "CPhase"

[variant_remapping]
"PrePrepare" = "CPhase::PrePrepare"
"Prepare" = "CPhase::Prepare"
"Commit" = "CPhase::Commit"
"Replied" = "CPhase::Replied"

[method_calls]

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use std::collections::HashSet;",
    "use crate::protocol::PBFT::types::*;",
    "use crate::protocol::PBFT::pbft::*;",
    "use crate::generated::PBFT::types_gen::*;",
]
