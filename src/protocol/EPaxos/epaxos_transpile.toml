# Configuration for transpiling EPaxos spec to exec implementation

# Skip functions that contain existential quantifiers
skip_functions = [
    "LNext",
]

# Fields that are HashSet types (Set) requiring clone_hashset()
collection_fields = ["preaccept_senders", "accept_senders"]

# Fields that are Vec types (Seq) requiring .clone()
vec_fields = []

# Fields that are non-Copy types requiring .clone()
clone_fields = ["phase"]

# Maps clone_fields to their exec enum types for generating clone helpers
[clone_field_types]
"phase" = "CInstancePhase"

[clone_strategy]
"CState" = "external_body"

[naming]
spec_prefix = "L"
exec_prefix = "C"
int_type = "u64"
nat_type = "u64"

[remapping]
"LState" = "CState"
"LConstants" = "CConstants"
"LInstancePhase" = "CInstancePhase"
"LEPaxosMessage" = "CEPaxosMessage"
# Prevent C-prefixing of message variant names
"PreAccept" = "PreAccept"
"PreAcceptOk" = "PreAcceptOk"
"Accept" = "Accept"
"AcceptOk" = "AcceptOk"
"Commit" = "Commit"

[variant_remapping]
"Empty" = "CInstancePhase::Empty"
"PreAccepted" = "CInstancePhase::PreAccepted"
"Accepted" = "CInstancePhase::Accepted"
"Committed" = "CInstancePhase::Committed"
"Executed" = "CInstancePhase::Executed"

[method_calls]

[output]
generate_abstraction_fns = true
generate_validity_predicates = true
validity_predicate_name = "valid"
generate_clone = true
include_debug_comments = false
generate_loops_for_verification = true
generate_proofs = true
generate_inline_types = false
custom_imports = [
    "use vstd::prelude::*;",
    "use vstd::set::*;",
    "use vstd::set_lib::*;",
    "use std::collections::HashSet;",
    "use crate::protocol::EPaxos::types::*;",
    "use crate::protocol::EPaxos::epaxos::*;",
    "use crate::generated::EPaxos::types_gen::*;",
]

[messages]
enum_name = "EPaxosMessage"
doc_comment = "Egalitarian Paxos protocol network messages."

[[messages.variants]]
name = "PreAccept"
doc = "Fast-path: leader sends PreAccept with ballot, command, and sequence number."
fields = [["ballot", "u64"], ["cmd", "u64"], ["seq", "u64"]]

[[messages.variants]]
name = "PreAcceptOk"
doc = "Fast-path response: replica reports its local sequence and conflict status."
fields = [["sender", "u64"], ["seq", "u64"], ["conflict", "bool"]]

[[messages.variants]]
name = "Accept"
doc = "Slow-path: leader sends Accept after conflict detected."
fields = [["ballot", "u64"], ["cmd", "u64"], ["seq", "u64"]]

[[messages.variants]]
name = "AcceptOk"
doc = "Slow-path acknowledgment from replica."
fields = [["sender", "u64"]]

[[messages.variants]]
name = "CommitMsg"
doc = "Commit notification broadcast to all replicas."
fields = [["cmd", "u64"], ["seq", "u64"]]
# Auto-generated from LNext — 11 actions
[scheduler]
next_fn = "LNext"
params = ["s", "s_", "c"]
action_count = 11

[[scheduler.actions]]
spec_name = "LPropose"
exec_name = "CPropose"
kind = "timer_driven"
existential_params = [["value", "int"], ["sent_packets", "Seq<LEPaxosMessage>"]]

[[scheduler.actions]]
spec_name = "LSendPreAcceptOk"
exec_name = "CSendPreAcceptOk"
kind = "message_driven"
message_variant = "PreAccept"
existential_params = [["local_conflict", "bool"], ["local_seq", "int"], ["sent_packets", "Seq<LEPaxosMessage>"]]

[[scheduler.actions]]
spec_name = "LReceivePreAcceptOk"
exec_name = "CReceivePreAcceptOk"
kind = "message_driven"
message_variant = "PreAcceptOk"
existential_params = [["pa_sender", "int"], ["pa_seq", "int"], ["pa_conflict", "bool"], ["sent_packets", "Seq<LEPaxosMessage>"]]

[[scheduler.actions]]
spec_name = "LFastCommit"
exec_name = "CFastCommit"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LEPaxosMessage>"]]

[[scheduler.actions]]
spec_name = "LStartAccept"
exec_name = "CStartAccept"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LEPaxosMessage>"]]

[[scheduler.actions]]
spec_name = "LSendAcceptOk"
exec_name = "CSendAcceptOk"
kind = "message_driven"
message_variant = "Accept"
existential_params = [["sent_packets", "Seq<LEPaxosMessage>"]]

[[scheduler.actions]]
spec_name = "LReceiveAcceptOk"
exec_name = "CReceiveAcceptOk"
kind = "message_driven"
message_variant = "AcceptOk"
existential_params = [["ao_sender", "int"], ["sent_packets", "Seq<LEPaxosMessage>"]]

[[scheduler.actions]]
spec_name = "LSlowCommit"
exec_name = "CSlowCommit"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LEPaxosMessage>"]]

[[scheduler.actions]]
spec_name = "LExecute"
exec_name = "CExecute"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LEPaxosMessage>"]]

[[scheduler.actions]]
spec_name = "LRecover"
exec_name = "CRecover"
kind = "timer_driven"
existential_params = [["new_ballot", "int"], ["sent_packets", "Seq<LEPaxosMessage>"]]

[[scheduler.actions]]
spec_name = "LNewInstance"
exec_name = "CNewInstance"
kind = "timer_driven"
existential_params = [["sent_packets", "Seq<LEPaxosMessage>"]]
