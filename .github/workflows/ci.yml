name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transpiler
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            transpiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('transpiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Regenerate DPOR test corpus
        run: DPOR_based_model_tla_rs_checker/scripts/regenerate_corpus.sh

      - name: Run tests
        run: cargo test --all-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transpiler
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            transpiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('transpiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transpiler
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  verify:
    name: Verus Verification
    # Verus 0.2026.08.02 is linked against glibc 2.39.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Latest stable release validated by the incremental Verus migration.
      # The rolling release currently points at the same b677dd5 commit.
      VERUS_VERSION: "0.2026.08.02.b677dd5"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and scons
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install scons

      - name: Cache Verus
        id: cache-verus
        uses: actions/cache@v4
        with:
          path: ~/verus
          key: verus-ubuntu-24.04-${{ env.VERUS_VERSION }}

      - name: Download Verus
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip
          unzip -q verus-${VERUS_VERSION}-x86-linux.zip -d ~/
          mv ~/verus-x86-linux ~/verus

      - name: Ensure Verus is executable
        run: chmod +x ~/verus/verus

      - name: Install Rust toolchain for Verus
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Verify with Verus
        run: |
          scons --verus-path=$HOME/verus/verus --skip-dotnet

  model-check-evidence:
    name: Model-Check Evidence Drift Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            transpiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('transpiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rebuild source-first matrix artifacts
        run: ./scripts/run_model_check_matrix.sh

      - name: Verify status-doc evidence paths
        run: ./scripts/verify_model_check_evidence_paths.sh
