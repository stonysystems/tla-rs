name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transpiler
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            transpiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('transpiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Regenerate DPOR test corpus
        run: DPOR_based_model_tla_rs_checker/scripts/regenerate_corpus.sh

      - name: Check README quickstart generation
        run: ../scripts/check_readme_quickstart.sh

      - name: Run tests
        run: cargo test --all-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transpiler
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            transpiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('transpiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  format:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transpiler
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  verify:
    name: Verus Verification
    # Verus 0.2026.08.02 is linked against glibc 2.39.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Latest stable release validated by the incremental Verus migration.
      # Pinned on purpose: this is the version the trigger ceiling and the
      # timing baseline were measured on. The `verify-rolling` job below tracks
      # the newest release separately, so a Verus change and one of ours stay
      # distinguishable.
      VERUS_VERSION: "0.2026.08.02.b677dd5"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and scons
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install scons

      - name: Cache Verus
        id: cache-verus
        uses: actions/cache@v4
        with:
          path: ~/verus
          key: verus-ubuntu-24.04-${{ env.VERUS_VERSION }}

      - name: Download Verus
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip
          unzip -q verus-${VERUS_VERSION}-x86-linux.zip -d ~/
          mv ~/verus-x86-linux ~/verus

      - name: Ensure Verus is executable
        run: chmod +x ~/verus/verus

      - name: Install Rust toolchain for Verus
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Verify with Verus
        run: |
          # pipefail so tee cannot mask a verification failure.
          # --verus-extra-args="--time-expanded" adds the per-module timing
          # breakdown to the same log (Phase 54.2.c); it changes no verifier
          # behaviour, only what is printed.
          set -o pipefail
          scons --verus-path=$HOME/verus/verus --skip-dotnet \
            --verus-extra-args="--time-expanded" 2>&1 | tee verus-verify.log

      # Phase 54.2.a: record which quantifier triggers Verus chose for us.
      # Runs even when verification failed (the notes are still emitted, and a
      # failing run's inventory is still evidence); --allow-empty and the lack
      # of any assertion here mean this step can never change the job verdict.
      - name: Capture trigger inventory
        if: always()
        run: |
          if [ ! -f verus-verify.log ]; then
            echo "no verification log (an earlier step failed); nothing to capture"
            exit 0
          fi
          python3 scripts/trigger_inventory.py parse verus-verify.log \
            --label "${VERUS_VERSION} scons --skip-dotnet (triggers-mode selective)" \
            --verus-version "${VERUS_VERSION}" \
            --root . \
            --allow-empty \
            -o trigger-inventory.json
          python3 scripts/trigger_inventory.py report trigger-inventory.json \
            -o trigger-inventory.md
          cat trigger-inventory.md >> "$GITHUB_STEP_SUMMARY"

      # Phase 54.2.c: the other half of the baseline. A trigger batch can
      # verify and still be a regression if it doubled a module's solve time,
      # which no pass/fail check sees. Report only -- the 20% gate belongs to
      # a diff against a committed baseline, not to this capture.
      - name: Capture verification timing
        if: always()
        run: |
          if [ ! -f verus-verify.log ]; then
            echo "no verification log (an earlier step failed); nothing to capture"
            exit 0
          fi
          python3 scripts/verus_timing.py parse verus-verify.log \
            --label "${VERUS_VERSION} scons --skip-dotnet" \
            --verus-version "${VERUS_VERSION}" \
            --allow-empty \
            -o verus-timing.json
          python3 scripts/verus_timing.py report verus-timing.json \
            -o verus-timing.md
          cat verus-timing.md >> "$GITHUB_STEP_SUMMARY"

      # Phase 54.9: keep the auto-chosen triggers from silently regrowing, and
      # catch the case where Verus changes its mind about an expression nobody
      # edited. The ceiling lives in reports/triggers/ceiling.json so raising it
      # is a reviewable diff with a stated reason, not a workflow edit. Until a
      # measured baseline is committed (54.2.b) the ceiling is unset and the
      # guard reports without failing -- asserting an unmeasured number would
      # either be vacuous or turn CI red for the wrong reason.
      - name: Guard trigger inventory
        if: always()
        run: |
          # pipefail: the guards below pipe into tee, and without it a failing
          # guard would exit 0 and quietly stop guarding anything.
          set -o pipefail
          if [ ! -f trigger-inventory.json ]; then
            echo "no inventory to guard (an earlier step failed)"
            exit 0
          fi
          BASELINE=""
          if [ -f reports/triggers/baseline.json ]; then
            BASELINE="--baseline reports/triggers/baseline.json"
          fi
          python3 scripts/trigger_inventory.py guard trigger-inventory.json \
            --ceiling reports/triggers/ceiling.json \
            --capture-mode selective \
            $BASELINE | tee -a "$GITHUB_STEP_SUMMARY"
          # Phase 54 acceptance: the checked-in exceptions list must describe
          # the notes that actually remain. A list that quietly falls out of
          # date satisfies the letter of "0 notes or a documented list" and
          # none of its intent.
          if [ -f reports/triggers/exceptions.md ]; then
            python3 scripts/trigger_exceptions.py trigger-inventory.json \
              --check reports/triggers/exceptions.md | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Timing is REPORTED here, not gated. The committed baseline was
          # measured on a 127-thread developer box; a GitHub runner has a
          # handful of cores. Verus verifies modules in parallel, so per-module
          # wall-clock tracks the core count -- a percentage between the two
          # measures the hardware, not the proof, and no threshold fixes that
          # (Phase 54.9.a). The 20% criterion is a *local* pre-merge gate; the
          # procedure is in docs/phase54-trigger-workflow.md 6b.
          if [ -f reports/triggers/timing-baseline.json ] && [ -f verus-timing.json ]; then
            python3 scripts/verus_timing.py diff \
              reports/triggers/timing-baseline.json verus-timing.json \
              --max-regression-pct 20 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no committed timing baseline; nothing to report"
          fi

      - name: Upload trigger inventory and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-inventory-${{ env.VERUS_VERSION }}
          path: |
            trigger-inventory.json
            trigger-inventory.md
            verus-timing.json
            verus-timing.md
          if-no-files-found: warn

      - name: Verify and run README quickstart
        run: VERUS_PATH="$HOME/verus/verus" ./scripts/check_readme_quickstart.sh

  # Verita (Verus compatibility CI) asks projects to keep a designated branch
  # verifying against the *latest* Verus, so that a breakage introduced by our
  # own change is caught by whoever made it. That is this job. It deliberately
  # does not pin: it resolves the newest rolling prerelease at run time, which
  # is the closest public artifact to Verus's main.
  #
  # Kept separate from `verify` rather than replacing it. The pinned job is what
  # makes a build reproducible and gives the trigger ceiling a measured meaning;
  # without it, a red run could not be attributed to our change or to upstream
  # drift. Two jobs answer two different questions.
  verify-rolling:
    name: Verus Verification (rolling)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest rolling release
        id: verus
        run: |
          set -o pipefail
          # Releases are tagged release/<version> (stable) and
          # release/rolling/<version> (prerelease). The rolling tags are the
          # ones marked prerelease, and /releases returns newest first.
          TAG=$(gh api repos/verus-lang/verus/releases \
            --jq '[.[] | select(.prerelease==true)] | .[0].tag_name')
          if [ -z "$TAG" ]; then
            echo "no rolling prerelease found" >&2
            exit 1
          fi
          VERSION="${TAG#release/rolling/}"
          # The version string ends in the Verus commit it was built from;
          # that commit's rust-toolchain.toml is the toolchain it needs, so the
          # job follows a Verus toolchain bump instead of failing on one.
          SHA="${VERSION##*.}"
          TOOLCHAIN=$(curl -sfL \
            "https://raw.githubusercontent.com/verus-lang/verus/${SHA}/rust-toolchain.toml" \
            | sed -n 's/^channel = "\(.*\)"/\1/p')
          if [ -z "$TOOLCHAIN" ]; then
            echo "could not read rust-toolchain.toml at ${SHA}" >&2
            exit 1
          fi
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "Resolved $VERSION (toolchain $TOOLCHAIN) from $TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install Python and scons
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install scons

      - name: Cache Verus
        id: cache-verus
        uses: actions/cache@v4
        with:
          path: ~/verus
          key: verus-ubuntu-24.04-${{ steps.verus.outputs.version }}

      - name: Download Verus
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          V="${{ steps.verus.outputs.version }}"
          gh release download "${{ steps.verus.outputs.tag }}" \
            --repo verus-lang/verus \
            --pattern "verus-${V}-x86-linux.zip" \
            --output verus.zip
          unzip -q verus.zip -d ~/
          mv ~/verus-x86-linux ~/verus
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Ensure Verus is executable
        run: chmod +x ~/verus/verus

      - name: Install Rust toolchain for Verus
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.verus.outputs.toolchain }}
          components: rustfmt

      - name: Verify with Verus
        run: |
          set -o pipefail
          scons --verus-path=$HOME/verus/verus --skip-dotnet 2>&1 \
            | tee verus-rolling.log

      # Report only. The committed ceiling of 0 was measured on the pinned
      # release; a rolling build may choose triggers differently, and a note
      # count that has never been measured on this version is not a threshold
      # anyone agreed to. Enforcing it here would turn the job red for a
      # change in Verus rather than a break in our proofs -- which is exactly
      # the confusion this job exists to avoid.
      - name: Report trigger notes (not enforced)
        if: always()
        run: |
          if [ ! -f verus-rolling.log ]; then
            echo "no verification log (an earlier step failed); nothing to report"
            exit 0
          fi
          python3 scripts/trigger_inventory.py parse verus-rolling.log \
            --label "${{ steps.verus.outputs.version }} rolling (triggers-mode selective)" \
            --verus-version "${{ steps.verus.outputs.version }}" \
            --root . \
            --allow-empty \
            -o trigger-inventory-rolling.json
          python3 scripts/trigger_inventory.py report trigger-inventory-rolling.json \
            -o trigger-inventory-rolling.md
          {
            echo "### Rolling: ${{ steps.verus.outputs.version }}"
            echo "_Notes are reported, not gated -- the ceiling of 0 is measured"
            echo "on the pinned release only._"
            cat trigger-inventory-rolling.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rolling inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trigger-inventory-rolling-${{ steps.verus.outputs.version }}
          path: |
            trigger-inventory-rolling.json
            trigger-inventory-rolling.md
            verus-rolling.log
          if-no-files-found: warn

  model-check-evidence:
    name: Model-Check Evidence Drift Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            transpiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('transpiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rebuild source-first matrix artifacts
        run: ./scripts/run_model_check_matrix.sh

      # Phase 37.2.1.j: the regeneration above proves the artifacts can be
      # rebuilt; this proves the rebuild still matches what is committed.
      # Volatile keys (elapsed_ms and the timing subtree) are ignored, so
      # runner-to-runner timing noise cannot make it red -- which is what
      # 37.2.1.f was worried about when it rejected a raw git diff. Everything
      # else (state counts, telemetry fields, paths) is compared exactly.
      - name: Guard against structural artifact drift
        run: ./scripts/check_model_check_drift.py

      - name: Verify status-doc evidence paths
        run: ./scripts/verify_model_check_evidence_paths.sh
