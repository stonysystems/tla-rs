# The standalone benchmark runs weekly or on demand because it takes about
# 15 minutes per compiler. Keep it out of PR/push CI and the daily nightly.
name: TLAPS-Bench

on:
  schedule:
    # Sunday at 04:17 UTC.
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tlaps-bench:
    name: TLAPS-Bench Verification (pinned)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERUS_VERSION: "0.2026.08.02.b677dd5"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Verus
        id: cache-verus
        uses: actions/cache@v4
        with:
          path: ~/verus
          key: verus-ubuntu-24.04-${{ env.VERUS_VERSION }}

      - name: Download Verus
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip
          unzip -q verus-${VERUS_VERSION}-x86-linux.zip -d ~/
          mv ~/verus-x86-linux ~/verus

      - name: Ensure Verus is executable
        run: chmod +x ~/verus/verus

      - name: Install Rust toolchain for Verus
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Verify TLAPS-Bench
        run: |
          set -o pipefail
          VERUS_PATH=$HOME/verus/verus bash scripts/verify_tlaps_bench_manual.sh 2>&1 \
            | tee tlaps-bench-verify.log

      - name: Reject automatically chosen triggers
        run: |
          notes=$(grep -c "automatically chose triggers for this expression" tlaps-bench-verify.log || true)
          echo "automatic-trigger notes: $notes"
          if [ "$notes" != "0" ]; then
            echo "::error::TLAPS-Bench emitted $notes automatic-trigger notes; annotate them explicitly"
            exit 1
          fi

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlaps-bench-pinned-${{ env.VERUS_VERSION }}
          path: tlaps-bench-verify.log
          if-no-files-found: warn

  verify-tlaps-bench-latest:
    name: TLAPS-Bench Verification (latest rolling)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest rolling release
        id: verus
        run: |
          set -o pipefail
          TAG=$(gh api repos/verus-lang/verus/releases \
            --jq '[.[] | select(.prerelease==true)] | .[0].tag_name')
          if [ -z "$TAG" ]; then
            echo "no rolling prerelease found" >&2
            exit 1
          fi
          VERSION="${TAG#release/rolling/}"
          SHA="${VERSION##*.}"
          TOOLCHAIN=$(curl -sfL \
            "https://raw.githubusercontent.com/verus-lang/verus/${SHA}/rust-toolchain.toml" \
            | sed -n 's/^channel = "\(.*\)"/\1/p')
          if [ -z "$TOOLCHAIN" ]; then
            echo "could not read rust-toolchain.toml at ${SHA}" >&2
            exit 1
          fi
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "Resolved $VERSION (toolchain $TOOLCHAIN) from $TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache Verus
        id: cache-verus
        uses: actions/cache@v4
        with:
          path: ~/verus
          key: verus-ubuntu-24.04-${{ steps.verus.outputs.version }}

      - name: Download Verus
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          V="${{ steps.verus.outputs.version }}"
          gh release download "${{ steps.verus.outputs.tag }}" \
            --repo verus-lang/verus \
            --pattern "verus-${V}-x86-linux.zip" \
            --output verus.zip
          unzip -q verus.zip -d ~/
          mv ~/verus-x86-linux ~/verus
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Ensure Verus is executable
        run: chmod +x ~/verus/verus

      # The Cargo-based release flow introduced upstream in verus#2881 shipped
      # its first rolling release (0.2026.09.02) without the bundled z3 the
      # zip always carried before. Whether or not upstream restores bundling,
      # fetch z3 ourselves with the same script Verus developers use, pinned
      # to the resolved commit so the z3 version always matches what that
      # Verus expects.
      - name: Provide z3 if the release does not bundle it
        run: |
          set -o pipefail
          if [ -x ~/verus/z3 ]; then
            echo "release bundles z3; nothing to do"
            exit 0
          fi
          SHA="${{ steps.verus.outputs.version }}"
          SHA="${SHA##*.}"
          curl -sfL \
            "https://raw.githubusercontent.com/verus-lang/verus/${SHA}/source/tools/get-z3.sh" \
            -o /tmp/get-z3.sh
          (cd ~/verus && bash /tmp/get-z3.sh)
          chmod +x ~/verus/z3
          ~/verus/z3 --version

      - name: Install Rust toolchain for Verus
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.verus.outputs.toolchain }}
          components: rustfmt

      - name: Verify TLAPS-Bench
        run: |
          set -o pipefail
          VERUS_PATH=$HOME/verus/verus bash scripts/verify_tlaps_bench_manual.sh 2>&1 \
            | tee tlaps-bench-rolling.log
          notes=$(grep -c "automatically chose triggers for this expression" tlaps-bench-rolling.log || true)
          echo "automatic-trigger notes: $notes"
          [ "$notes" = "0" ]

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlaps-bench-rolling-${{ steps.verus.outputs.version }}
          path: tlaps-bench-rolling.log
          if-no-files-found: warn
